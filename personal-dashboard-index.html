<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Personal Dashboard</title>

  <link rel="stylesheet" href="css/personal-dashboard-css/base.css" />
  <link rel="stylesheet" href="css/personal-dashboard-css/layout.css" />
  <link rel="stylesheet" href="css/personal-dashboard-css/cards.css" />
  <link rel="stylesheet" href="css/personal-dashboard-css/buttons.css" />
  <link rel="stylesheet" href="css/personal-dashboard-css/progress.css" />
  <link rel="stylesheet" href="css/personal-dashboard-css/dashboard.css" />
  <link rel="stylesheet" href="css/personal-dashboard-css/theme.css" />
</head>

<body>
  <main class="personal-dashboard-app">
    <header class="dashboard-header">
      <p class="eyebrow">Today’s Quest</p>
      <h1>Good morning, MJ 🌿</h1>
      <p class="subtitle">Tiny wins count. No guilt. Just today.</p>
    </header>

    <section class="dashboard-card">
      <h2>Energy Today</h2>

      <div class="energy-grid">
        <button class="energy-button">🌧 Barely Surviving</button>
        <button class="energy-button">🌤 Low Energy</button>
        <button class="energy-button selected">☀️ Normal Day</button>
        <button class="energy-button">⚡ Super Motivated</button>
      </div>
    </section>

    <section class="dashboard-card">
      <h2>💧 Water</h2>
      <p><span id="water-count">0</span> / 10 glasses</p>

      <div class="progress-bar">
        <div id="water-progress" class="progress-fill"></div>
      </div>

      <div class="button-row">
        <button id="add-water-button">+1 Glass</button>
        <button id="remove-water-button" class="secondary-button">-1</button>
      </div>
    </section>

    <section class="dashboard-card">
      <h2>🚶 Walking</h2>
      <p><span id="walking-count">0</span> / 30 minutes</p>

      <div class="progress-bar">
        <div id="walking-progress" class="progress-fill"></div>
      </div>

      <div class="button-row">
        <button class="walk-button" data-minutes="5">+5</button>
        <button class="walk-button" data-minutes="10">+10</button>
        <button class="walk-button" data-minutes="30">+30</button>
        <button class="walk-button secondary-button" data-minutes="-5">-5</button>
      </div>
    </section>

    <section class="dashboard-card">
      <h2>⭐ Today’s Big Three</h2>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Therapy
      </label>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Kitchen Reset
      </label>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Fold Laundry
      </label>
    </section>

    <section class="dashboard-card">
      <h2>🏡 Today’s Habits</h2>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Brush Teeth
      </label>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Vitamins
      </label>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Wash Face
      </label>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Dishwasher
      </label>

      <label class="habit-row">
        <input type="checkbox" class="task-checkbox" />
        Laundry
      </label>
    </section>

    <section class="dashboard-card score-card">
      <h2>🎉 Score Today</h2>
      <p id="daily-score">0%</p>
    </section>

    <footer class="dashboard-footer">
      <p>You’re doing better than you think. 💚</p>
    </footer>
  </main>

  <script src="js/personal-dashboard-js/storage.js"></script>
  <script src="js/personal-dashboard-js/progress.js"></script>
  <script src="js/personal-dashboard-js/dashboard.js"></script>
  <script src="js/personal-dashboard-js/app.js"></script>
</body>
</html>
