<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blizzard Book Rescue — Three-Level Winter Adventure</title><style>body{margin:0;background:#102d4c;color:white;font-family:Trebuchet MS,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(100vw,1050px)}canvas{width:100%;aspect-ratio:16/9;background:#a9d9ed;border-radius:15px;display:block}header{display:flex;justify-content:space-between;padding:8px 12px}button{background:#f4d87b;border:0;border-radius:10px;padding:10px 18px;font-weight:bold;cursor:pointer}p{margin:6px 12px 12px;font-size:14px}#message{min-height:22px;color:#ffe8a1}#activity{display:none;position:relative;background:linear-gradient(#c3e9fa,#eaf8ff);color:#163b58;border-radius:16px;min-height:490px;padding:22px;box-sizing:border-box;text-align:center}#activity h2{font-size:30px;margin:5px}#activity p{font-size:19px}#activity button{margin:8px;font-size:18px}#activity .answers{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin:20px}#activity .answers button{background:#fff;border:3px solid #77b8d6;max-width:370px;min-height:90px}#activity .answers button:hover,#activity .tile:hover{background:#d9f3ff}#activity .tile{touch-action:none;cursor:grab;user-select:none;background:#fff6da;border:3px solid #78a9c7;border-radius:12px;padding:16px 8px;min-width:125px;font-size:19px;font-weight:bold;color:#163b58}#activity .tile.selected{outline:5px solid #efb953}#activity .tile.dragging{opacity:.4}#activity .shelf{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:105px;align-items:center;margin:20px auto;padding:14px;border-radius:15px;background:#b0d8e8}#feedback{font-size:21px;font-weight:bold;min-height:34px}#activity .hint{font-size:15px}#activity .progress{font-size:17px;font-weight:bold}#game.hide{display:none}#activity.show{display:block}@media(max-width:650px){#activity{min-height:450px;padding:10px}#activity .tile{min-width:85px;padding:10px 5px;font-size:16px}#activity h2{font-size:23px}} #activity .ice-scene{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px auto 6px;max-width:780px}.ice-fox{font-size:49px}.ice-shore{font-size:42px}.ice-water{flex:1;min-width:0;padding:23px 10px;background:repeating-linear-gradient(135deg,#64b8d9,#64b8d9 22px,#76c7e5 22px,#76c7e5 44px);border-radius:24px;border:4px solid #b7e9f7}.ice-bridge{display:flex;gap:9px;justify-content:center}.ice-slot{flex:1;max-width:115px;min-width:0;min-height:85px;display:grid;place-items:center;border:4px dashed #f8ffff;border-radius:13px;background:#a6dceb;color:#173c5b;font-size:36px;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #4a9bb9}.ice-slot.filled{border-style:solid;background:#e3faff}.ice-slot.hover{background:#fff2ba}.slot-number{opacity:.45;font-size:20px}.ice-bank{display:flex;justify-content:center;gap:12px;min-height:90px;align-items:center;margin:8px auto 14px}.ice-letter{width:70px;height:70px;border-radius:14px;background:#fff9d9;border:3px solid #669db7;display:grid;place-items:center;font-size:36px;font-weight:bold;color:#163b58;cursor:grab;touch-action:manipulation;box-shadow:0 5px 0 #8baebd}.ice-letter.selected{outline:5px solid #e7b34c}#activity .ice-slot:focus-visible,#activity .ice-letter:focus-visible{outline:4px solid #edb43d}@media(max-width:650px){.ice-fox,.ice-shore{font-size:26px}.ice-slot{min-height:58px;font-size:25px}.ice-letter{width:53px;height:53px;font-size:27px}.ice-water{padding:12px 5px}.ice-bridge{gap:4px}}</style></head><body><main><header><strong>🦊 Blizzard Book Rescue · 3-Level Adventure</strong><span id="stats">Level 1 · ❄️ 0 · ❤️ 3</span><button id="sound">🔊 Read clue</button></header><section id="activity" aria-live="polite"></section><canvas id="game" width="960" height="540" aria-label="Winter fox platform game"></canvas><p id="message">Arrow keys to move · Space to jump · Collect books and reach the glowing gate!</p><p><butt const c=document.querySelector('canvas'),x=c.getContext('2d'),msg=document.querySelector('#message'),stats=document.querySelector('#stats');let level=0,score=0,hearts=3,mode='intro',frame=0,held={},player,books,obstacles,platforms,gate,question,chosen=0;const stages=[{name:'Snowy Forest Dash',platforms:[[0,490,960,50],[180,405,160,20],[405,330,160,20],[650,395,160,20]],books:[[95,445],[225,360],[460,285],[710,350]],obstacles:[[360,465,24],[600,465,24]]},{name:'Frozen Bridge',platforms:[[0,490,960,50],[125,405,140,20],[345,345,145,20],[590,390,160,20]],books:[[160,360],[390,300],[630,345],[840,445]],obstacles:[[285,465,26],[535,465,26],[775,465,26]]},{name:'Crystal Cave',platforms:[[0,490,960,50],[135,410,155,20],[365,325,165,20],[640,390,160,20]],books:[[185,365],[410,280],[680,345],[870,445]],obstacles:[[315,465,25],[560,465,25],[815,465,25]]}];const questions=[{clue:'A dragon learns to ice skate with a rabbit.',answer:0},{clue:'Photographs show how real penguins stay warm.',answer:1},{clue:'A guide explains how to dress for cold weather.',answer:1},{clue:'A mitten comes alive and goes on an adventure.',answer:0},{clue:'A book teaches facts about animal tracks in snow.',answer:1},{clue:'A friendly yeti invites a fox to a snow party.',answer:0}];function resetStage(){let s=stages[level];player={x:35,y:440,vx:0,vy:0,w:35,h:44,on:false,inv:0};books=s.books.map(([a,b])=>({x:a,y:b,got:false}));obstacles=s.obstacles.map(([a,b,r])=>({x:a,y:b,r}));platforms=s.platforms;gate={x:900,y:425};mode='play';msg.textContent='Rescue all four books, then reach the glowing gate!';}function start(){document.querySelector('#activity').classList.remove('show');c.classList.remove('hide');level=0;score=0;hearts=3;resetStage()}function speak(){let t=mode==='activity'?activitySpeech:mode==='question'?question.clue:mode==='intro'?'Help the fox rescue lost books! Use arrow keys to move and space to jump.':msg.textContent;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.83;speechSynthesis.speak(u)}}document.querySelector('#sound').onclick=speak;document.querySelector('#restart').onclick=start;for(let k of ['left','right','jump']){let b=document.querySelector('#'+k);b.onpointerdown=e=>{e.preventDefault();held[k]=true};b.onpointerup=b.onpointercancel=()=>held[k]=false;}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','Digit1','Digit2','Enter'].includes(e.code))e.preventDefault();held[e.code]=true;if(mode==='intro'&&e.code==='Enter')start();if(mode==='question'&&(e.code==='Digit1'||e.code==='Digit2'))answer(e.code==='Digit1'?0:1);if(mode==='won'&&e.code==='Enter')start()});window.addEventListener('keyup',e=>held[e.code]=false);c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*960/r.width,py=(e.clientY-r.top)*540/r.height;if(mode==='intro'||mode==='won'){start();return}if(mode==='careplay'){careTarget={x:px,y:py};return}if(mode==='question'&&py>250&&py<425){answer(px<480?0:1)}});function ask(){question=questions[(level*2+Math.floor(score/4))%questions.length];mode='question';msg.textContent='Choose the correct portal: 1 = Fiction, 2 = Nonfiction. Press 1 or 2, or click a portal.';speak()}function answer(a){if(a===question.answer){score+=5;level++;if(level>=3){mode='activity';startCare();}else resetStage()}else{msg.textContent='Try again! Fiction is make-believe; nonfiction gives real facts.';speak()}}function rect(a,b,w,h,color){x.fillStyle=color;x.fillRect(a,b,w,h)}function round(a,b,w,h,r,color){x.fillStyle=color;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}function text(t,a,b,size=22,color='#153956'){x.fillStyle=color;x.font=`bold ${size}px Trebuchet MS,Arial`;x.textAlign='center';x.fillText(t,a,b)}function background(){let sky=x.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#7bb4d9');sky.addColorStop(1,'#e0f6ff');rect(0,0,960,540,sky);for(let i=0;i<18;i++){let a=(i*137+23)%960,b=80+(i*59)%370;x.fillStyle='#fff';x.beginPath();x.arc(a+(frame*(i%3+1)*.25)%960-20,b,2+(i%3),0,Math.PI*2);x.fill()}for(let i=0;i<12;i++){let a=i*91-20,b=420+(i%3)*20;rect(a+23,b-60,8,80,'#4b7e84');x.fillStyle='#376f79';x.beginPath();x.moveTo(a,b-30);x.lineTo(a+27,b-125);x.lineTo(a+54,b-30);x.fill();}rect(0,520,960,20,'#dff6ff')}function fox(){let p=player;x.save();x.translate(p.x,p.y);if(p.inv>0&&frame%8<4)x.globalAlpha=.4;round(5,12,30,30,12,'#d76d39');x.fillStyle='#e9a371';x.beginPath();x.moveTo(6,16);x.lineTo(7,-2);x.lineTo(19,10);x.lineTo(29,-2);x.lineTo(35,16);x.fill();round(10,25,22,12,6,'#fff2df');x.fillStyle='#142e42';x.beginPath();x.arc(15,20,2.4,0,7);x.arc(28,20,2.4,0,7);x.fill();round(4,32,34,7,3,'#367cb4');x.fillStyle='#d76d39';x.beginPath();x.moveTo(8,35);x.lineTo(-16,22);x.lineTo(-8,43);x.fill();x.restore()}function draw(){frame++;background();if(mode==='activity'){requestAnimationFrame(draw);return}if(mode==='careplay'){drawCareWorld();requestAnimationFrame(draw);return}if(mode==='intro'){round(160,90,640,340,28,'#f7fcff');text('🦊 BLIZZARD BOOK RESCUE',480,160,38);text('A snowy platform adventure!',480,210,24);text('Run • Jump • Collect books • Solve clues',480,270,23);text('Press ENTER or click to begin',480,360,26);requestAnimationFrame(draw);return}for(let [a,b,w,h]of platforms){round(a,b,w,h,8,'#7aabc2');round(a,b,w,11,6,'#f7ffff')}for(let o of obstacles){x.fillStyle='#e8f9ff';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();x.strokeStyle='#6a9fb8';x.lineWidth=3;x.stroke()}for(let b of books){if(b.got)continue;round(b.x,b.y,23,30,3,'#f0aa5a');rect(b.x+5,b.y,3,30,'#fff4d0');text('✦',b.x+12,b.y-5,17,'#fff')}round(gate.x,gate.y,42,65,16,books.every(b=>b.got)?'#66d5e0':'#a2b8c5');text('❄',gate.x+21,gate.y+40,29,'#fff');fox();if(mode==='play'){let p=player;let l=held.ArrowLeft||held.KeyA||held.left,r=held.ArrowRight||held.KeyD||held.right,j=held.Space||held.ArrowUp||held.jump;p.vx=(r?4:0)-(l?4:0);if(j&&p.on){p.vy=-12.5;p.on=false}let oldBottom=p.y+p.h;p.x=Math.max(0,Math.min(925,p.x+p.vx));p.vy=Math.min(14,p.vy+.58);p.y+=p.vy;p.on=false;for(let [a,b,w,h]of platforms){if(p.vy>=0&&oldBottom<=b+10&&p.y+p.h>=b&&p.x+p.w>a&&p.x<a+w){p.y=b-p.h;p.vy=0;p.on=true}}if(p.y>550){hearts--;resetStage()}if(p.inv>0)p.inv--;for(let o of obstacles){if(p.inv===0&&Math.hypot(p.x+17-o.x,p.y+24-o.y)<o.r+17){hearts--;p.inv=90;p.vy=-8;if(hearts<=0){hearts=3;resetStage();msg.textContent='Snowball surprise! Try the level again. Unlimited retries!'}}}for(let b of books){if(!b.got&&Math.abs(p.x+17-b.x-12)<28&&Math.abs(p.y+22-b.y-15)<35){b.got=true;score+=10}}if(p.x+35>gate.x&&p.y+44>gate.y&&books.every(b=>b.got))ask();}stats.textContent=`Level ${Math.min(level+1,3)} · ❄️ ${score} · ❤️ ${hearts} · 📚 ${books.filter(b=>b.got).length}/4`;if(mode==='question'){round(115,70,730,400,24,'#f9fdff');text('The Frozen Book Portals',480,135,34);text(question.clue,480,205,21);round(155,255,300,150,22,'#a0c3ed');round(505,255,300,150,22,'#a7ddd1');text('1 · FICTION',305,330,30);text('2 · NONFICTION',655,330,28);text('Make-believe story',305,370,17);text('Real facts',655,370,17)}if(mode==='won'){round(130,100,700,340,25,'#f9fdff');text('❄️ YOU SAVED THE LIBRARY! ❄️',480,185,33);text('All the books are safe and sound!',480,250,25);text(`Snowflake points: ${score}`,480,310,26);text('Press ENTER or click to play again',480,375,21)}requestAnimationFrame(draw)}const activity=document.querySelector('#activity');let activitySpeech='',careIndex=0,abcIndex=0,order=[],selected=-1,careFox={x:90,y:260},careTarget=null,careSolved=[],carePrompt=false;const care=[{scene:'A fox finds a book beside a puddle of water.',q:'How should the fox keep the book safe?',choices:['Leave it in the puddle','Move it to a clean, dry table','Wash it in the sink'],a:1,why:'Books should stay clean and dry!'},{scene:'A reader wants to save a page for later.',q:'What should the reader use?',choices:['Fold the corner','Use a bookmark','Draw a star on the page'],a:1,why:'A bookmark keeps the page safe!'},{scene:'A book has a torn page.',q:'What is the best thing to do?',choices:['Tell the librarian','Pull off the page','Hide the book'],a:0,why:'The librarian can help repair a damaged book!'},{scene:'The fox has sticky paws after a snack.',q:'What should the fox do before reading?',choices:['Wipe paws on the book','Keep eating over the pages','Clean and dry paws'],a:2,why:'Clean, dry hands help protect books!'},{scene:'It is time to put a library book away.',q:'How should the fox carry the book?',choices:['Hold it carefully with both paws','Drag it across the floor','Throw it onto a shelf'],a:0,why:'Carry books carefully so they stay in good shape!'}];const abcRounds=[['A','B','C'],['D','E','F'],['G','H','I','J'],['K','L','M','N'],['P','Q','R','S']];function showActivity(){c.classList.add('hide');activity.classList.add('show');}const careSites=[{x:190,y:135,icon:'💧',name:'Wet book'},{x:735,y:140,icon:'📖',name:'Torn page'},{x:465,y:280,icon:'🍯',name:'Sticky book'},{x:190,y:425,icon:'📚',name:'Book on floor'},{x:760,y:425,icon:'🔖',name:'Folded page'}];
function startCare(){activity.classList.remove('show');c.classList.remove('hide');careIndex=0;careSolved=[];careFox={x:90,y:260};careTarget=null;carePrompt=false;mode='careplay';msg.textContent='Explore with arrow keys or WASD. Walk close to a glowing book to open its rescue challenge automatically!';stats.textContent=`Level 2 · ❄️ ${score} · 📚 0/5`}
function drawCareWorld(){frame++;rect(0,0,960,540,'#ccecf3');for(let i=0;i<14;i++){let a=i*73;rect(a,0,3,540,'#b5dce9')}for(let i=0;i<8;i++)rect(0,i*70,960,3,'#b5dce9');round(310,35,340,75,18,'#8fb2c5');text('❄️ BOOK CARE RESCUE ❄️',480,81,27,'#fff');for(let i=0;i<careSites.length;i++){let t=careSites[i],done=careSolved.includes(i);round(t.x-55,t.y-40,110,80,15,done?'#a7dfc8':'#f8fbff');text(done?'⭐':t.icon,t.x,t.y+7,36);text(done?'RESCUED':t.name,t.x,t.y+30,14)}let l=held.ArrowLeft||held.KeyA||held.left,r=held.ArrowRight||held.KeyD||held.right,u=held.ArrowUp||held.KeyW||held.jump,d=held.ArrowDown||held.KeyS;if(careTarget){let dx=careTarget.x-careFox.x,dy=careTarget.y-careFox.y;if(Math.hypot(dx,dy)>6){careFox.x+=dx/Math.hypot(dx,dy)*3;careFox.y+=dy/Math.hypot(dx,dy)*3}else careTarget=null}if(l||r||u||d){careTarget=null;careFox.x+=(r?3.5:0)-(l?3.5:0);careFox.y+=(d?3.5:0)-(u?3.5:0)}careFox.x=Math.max(28,Math.min(930,careFox.x));careFox.y=Math.max(115,Math.min(510,careFox.y));player={x:careFox.x-17,y:careFox.y-24,inv:0};fox();let near=careSites.findIndex((t,i)=>!careSolved.includes(i)&&Math.hypot(t.x-careFox.x,t.y-careFox.y)<90);if(near>=0){careIndex=near;inspectCare();}else careIndex=-1;stats.textContent=`Level 2 · ❄️ ${score} · 📚 ${careSolved.length}/5`;}
function inspectCare(){if(mode!=='careplay'||careIndex<0)return;carePrompt=true;mode='activity';showActivity();renderCare()}
function renderCare(){let q=care[[0,2,3,4,1][careIndex]];activitySpeech=q.scene+' '+q.q+' '+q.choices.map((a,i)=>`${i+1}. ${a}`).join('. ');activity.innerHTML=`<div class="progress">❄️ LEVEL 2 · BOOK CARE RESCUE · ${careSolved.length}/5 SAVED</div><h2>🦊 ${careSites[careIndex].name}</h2><p>${q.scene}</p><h3>${q.q}</h3><div class="answers">${q.choices.map((a,i)=>`<button data-care="${i}">${a}</button>`).join('')}</div><div id="feedback" role="status">Choose how to rescue this book!</div>`;activity.querySelectorAll('[data-care]').forEach(b=>b.onclick=()=>{let i=+b.dataset.care;if(i===q.a){score+=10;careSolved.push(careIndex);activity.querySelector('#feedback').textContent='⭐ Great rescue! '+q.why;activity.querySelectorAll('[data-care]').forEach(z=>z.disabled=true);let next=document.createElement('button');next.textContent=careSolved.length===5?'Go to Level 3 →':'Keep exploring →';next.onclick=()=>{if(careSolved.length===5)startABC();else{activity.classList.remove('show');c.classList.remove('hide');mode='careplay';msg.textContent='Find another book! Walk near it to start its rescue challenge.'}};activity.appendChild(next)}else activity.querySelector('#feedback').textContent='❄️ Try another choice! Think about keeping books safe.'});}
function startABC(){abcIndex=0;renderABC(true)}
function renderABC(fresh){
 const correct=abcRounds[abcIndex];
 if(fresh){order=Array(correct.length).fill(null);window.iceBank=[...correct].reverse();selected=-1}
 activitySpeech='Help the fox cross! Drag each letter from the snowbank into an empty ice bridge space, in ABC order. You can also tap a letter and then tap a bridge space.';
 const bank=window.iceBank;
 activity.innerHTML=`<div class="progress">❄️ LEVEL 3 OF 3 · ALPHABET ICE BRIDGE · BRIDGE ${abcIndex+1}/${abcRounds.length}</div><h2>🧊 Build the Alphabet Ice Bridge!</h2><p>Put the letters in ABC order. Drag each letter into an <strong>empty space</strong> on the bridge!</p><div class="ice-scene"><div class="ice-fox">🦊</div><div class="ice-water"><div class="ice-bridge" id="iceBridge">${order.map((letter,i)=>`<div class="ice-slot ${letter?'filled':''}" data-slot="${i}" tabindex="0" role="button" aria-label="Bridge space ${i+1}${letter?', letter '+letter:', empty'}">${letter||'<span class="slot-number">'+(i+1)+'</span>'}</div>`).join('')}</div></div><div class="ice-shore">🏔️</div></div><p class="hint">Drag a letter to a bridge space, or tap a letter and then tap its space. Tap a placed letter to move it back.</p><div class="ice-bank" id="iceBank">${bank.map((letter,i)=>letter?`<div class="ice-letter ${selected===i?'selected':''}" draggable="true" data-bank="${i}" tabindex="0" role="button" aria-label="Letter ${letter}">${letter}</div>`:'').join('')}</div><button id="checkOrder">❄️ Check my bridge!</button><div id="feedback" role="status"></div>`;
 const slots=activity.querySelectorAll('.ice-slot');
 const letters=activity.querySelectorAll('.ice-letter');
 function moveToSlot(i,j){if(!bank[i])return;const letter=bank[i];if(order[j]){bank[i]=order[j]}else bank[i]=null;order[j]=letter;selected=-1;renderABC(false)}
 function returnToBank(j){if(!order[j])return;let i=bank.findIndex(v=>v===null);if(i<0)i=bank.length;bank[i]=order[j];order[j]=null;selected=-1;renderABC(false)}
 letters.forEach(el=>{const i=+el.dataset.bank;el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});el.addEventListener('click',()=>{selected=i;renderABC(false)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}})});
 slots.forEach(el=>{const j=+el.dataset.slot;el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('hover')});el.addEventListener('dragleave',()=>el.classList.remove('hover'));el.addEventListener('drop',e=>{e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<bank.length)moveToSlot(i,j)});el.addEventListener('click',()=>{if(selected>=0)moveToSlot(selected,j);else returnToBank(j)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}})});
 activity.querySelector('#checkOrder').onclick=()=>{let feedback=activity.querySelector('#feedback');if(order.some(v=>!v)){feedback.textContent='Fill every empty ice space first!';return}if(order.every((v,i)=>v===correct[i])){score+=15;feedback.textContent='🌟 Bridge complete! The fox can cross!';activity.querySelector('#checkOrder').disabled=true;activity.querySelectorAll('.ice-letter,.ice-slot').forEach(el=>{el.draggable=false;el.style.pointerEvents='none'});let btn=document.createElement('button');btn.textContent=abcIndex===abcRounds.length-1?'Celebrate our victory! 🎉':'Next ice bridge →';btn.onclick=()=>{abcIndex++;if(abcIndex===abcRounds.length)finishGame();else renderABC(true)};activity.appendChild(btn)}else feedback.textContent='Not quite! Say the alphabet and move the letters until they are in order.'};
 stats.textContent=`Level 3 · ❄️ ${score} · Bridge ${abcIndex+1}/${abcRounds.length}`;
}
function finishGame(){activitySpeech='Congratulations! You saved the Winter Learning Lodge!';activity.innerHTML=`<h2>🏆 YOU SAVED THE WINTER LEARNING LODGE! 🦊</h2><p style="font-size:65px">❄️ 📚 🧊 ⭐</p><p>You rescued the books, practiced book care, and built every ABC ice bridge!</p><h2>❄️ ${score} snowflake points!</h2><button id="again">Play again ↻</button><p>No assignment to turn in and nothing for your teacher to grade. Great job!</p>`;activity.querySelector('#again').onclick=start;stats.textContent=`All 3 levels complete · ❄️ ${score}`;}resetStage();mode='intro';draw();
</script></body></html>
