<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   1st Grade | Winter Lodge
  </title>
  <style>
   *{
box-sizing:border-box}
html,body{
margin:0;
min-height:100%;
font-family:'Trebuchet MS',Arial,sans-serif}
body{
min-height:100dvh;
display:grid;
place-items:center;
overflow-x:hidden;
background:radial-gradient(ellipse at 50% 20%,#b8e7ff,#73b7e5 48%,#3776b6);
padding:clamp(7px,1.5vw,18px)}
.snow{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:0}
.flake{
position:absolute;
top:-10vh;
color:#fff;
opacity:.8;
animation:fall linear infinite}
@keyframes fall{
to{
transform:translate3d(25px,120vh,0) rotate(180deg)}
}
.scene{
position:relative;
z-index:1;
width:min(100%,calc((100dvh - 25px)*1.777),1500px);
aspect-ratio:1672/941;
border:clamp(4px,.6vw,9px) solid white;
border-radius:clamp(12px,2vw,26px);
overflow:hidden;
box-shadow:0 15px 55px #10395e70;
background:#9acde7}
.scene img{
width:100%;
height:100%;
display:block}

.door {
  position:absolute;
  top:37%;
  height:38%;
  width:34%;
  border-radius:15%;
  display:block;
  cursor:pointer;
  outline-offset:-5px;
}
.door:focus-visible{
outline:5px solid #ffe36d}
.door:hover{
background:#ffffff24;
box-shadow:inset 0 0 0 4px #fff8}
.must { left:16.5%; }
.may { right:13%; }
.locked{
cursor:not-allowed;
filter:grayscale(.8);
background:#1e3a4a55}
.lock {
  position:absolute;
  right:17%;
  top:40%;
  font-size:clamp(22px,5vw,75px);
  pointer-events:none;
  filter:drop-shadow(0 3px 4px #0007);
}


.back {
  position:absolute;
  left:1%;
  top:75%;
  width:22%;
  height:22%;
  border-radius:12%;
  cursor:pointer;
}
.back:hover,.back:focus-visible{
outline:3px solid #fff9}
.teacher{
position:fixed;
bottom:6px;
right:8px;
z-index:3;
background:#ffffffd9;
color:#24536a;
border:0;
border-radius:16px;
padding:6px 12px;
font-size:12px;
cursor:pointer}
.dialog{
border:0;
border-radius:20px;
max-width:380px;
width:calc(100% - 24px);
padding:24px;
box-shadow:0 20px 70px #0006;
text-align:center}
.dialog::backdrop{
background:#0b3140a8}
.dialog input{
font:inherit;
font-size:22px;
width:100%;
padding:12px;
border:2px solid #85b5ca;
border-radius:10px;
text-align:center}
.dialog button{
font:inherit;
padding:10px 15px;
border:0;
border-radius:12px;
background:#16728c;
color:white;
cursor:pointer;
margin:10px 3px}
.dialog .cancel{
background:#697d86}
.error{
color:#9a1e28;
min-height:1.4em}
 @media(prefers-reduced-motion:reduce){
.flake{
animation:none}
}
  </style>
 </head>
 <body>
  <div aria-hidden="true" class="snow" id="snow">
  </div>
  <main class="scene">
   <img alt="Snowy signs: blue book for Must Do and green pickle for May Do" src="winter-choice-cottages.png"/>
   
   <a aria-label="Play Must Do game" class="door must" href="december_1_must-do_skills.html">
   </a>
   <a aria-label="May Do choices" class="door may" href="./may-do/lower/index.html" id="may">
   </a>
   <span aria-hidden="true" class="lock" id="lock">
    🔒
   </span>
   <a aria-label="Back to Winter Lodge" class="back" href="December_Winter_Learning_Lodge.html">
    
   </a>
  </main>
  <button class="teacher" id="teacher">
   🔑 Teacher
  </button>
  <dialog class="dialog" id="dialog">
   <h2>
    Teacher Override
   </h2>
   <p>
    Enter the teacher PIN to unlock May Do on this browser.
   </p>
   <input aria-label="Teacher PIN" autocomplete="off" id="pin" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" type="password"/>
   <p class="error" id="error" role="alert">
   </p>
   <button id="unlock">
    Unlock May Do
   </button>
   <button class="cancel" id="cancel">
    Cancel
   </button>
  </dialog>
  <script>
   const grade = 1, key = 'lrcquest:december2026:mustdo:grade:' + grade, may = document.getElementById('may'), lock = document.getElementById('lock');
function isUnlocked() { try {
    return localStorage.getItem(key) === 'complete';
}
catch (e) {
    return false;
} }
function update() { const ok = isUnlocked(); may.classList.toggle('locked', !ok); may.setAttribute('aria-label', ok ? 'Open May Do choices' : 'May Do locked. Complete Must Do first'); lock.hidden = ok; }
may.addEventListener('click', e => { if (!isUnlocked()) {
    e.preventDefault();
    alert('🔒 Finish your Must Do adventure to unlock May Do!');
} });
const dialog = document.getElementById('dialog'), pin = document.getElementById('pin'), error = document.getElementById('error');
document.getElementById('teacher').onclick = () => { pin.value = ''; error.textContent = ''; dialog.showModal(); pin.focus(); };
document.getElementById('cancel').onclick = () => dialog.close();
document.getElementById('unlock').onclick = () => { if (pin.value === '0913') {
    try {
        localStorage.setItem(key, 'complete');
    }
    catch (e) {
        error.textContent = 'Browser storage is unavailable.';
        return;
    }
    dialog.close();
    update();
    alert('❄️ May Do is unlocked!');
}
else {
    error.textContent = 'Incorrect PIN. Please try again.';
    pin.value = '';
    pin.focus();
} };
pin.addEventListener('keydown', e => { if (e.key === 'Enter')
    document.getElementById('unlock').click(); });
update();
for (let i = 0; i < 34; i++) {
    const f = document.createElement('span');
    f.className = 'flake';
    f.textContent = i % 3 ? '•' : '❄';
    f.style.left = (i * 37 % 100) + '%';
    f.style.fontSize = (10 + i % 5 * 4) + 'px';
    f.style.animationDuration = (9 + i % 9) + 's';
    f.style.animationDelay = (-i * .7) + 's';
    document.getElementById('snow').append(f);
}
  </script>
 </body>
</html>
