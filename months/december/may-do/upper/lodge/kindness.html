    <h1>Kindness Corner</h1>
    <p>Grades 3–5 · Teacher planning draft</p>
    <section class="panel">
      <h2>Suggested activities</h2>
      <label><input type="checkbox" data-task="idea-0"> Prepare: Design a gratitude postcard without submitting it</label>
      <label><input type="checkbox" data-task="idea-1"> Prepare: Explore an inclusion scenario</label>
      <label><input type="checkbox" data-task="idea-2"> Prepare: Choose a helpful response to a peer</label>
    </section>
    <section class="panel">
      <h2>Content setup checklist</h2>
      <p id="progress" aria-live="polite"></p>
      <label><input type="checkbox" data-task="task-0"> Review existing LRC Quest resources</label>
      <label><input type="checkbox" data-task="task-1"> Choose optional activities</label>
      <label><input type="checkbox" data-task="task-2"> Verify links and school access</label>
      <label><input type="checkbox" data-task="task-3"> Create missing resources</label>
      <label><input type="checkbox" data-task="task-4"> Add short visual instructions and optional audio</label>
      <label><input type="checkbox" data-task="task-5"> Avoid collecting names or personal messages</label>
      <label><input type="checkbox" data-task="task-6"> Include choices that respect boundaries</label>
      <label><input type="checkbox" data-task="task-7"> Check examples for inclusive language</label>
      <label><input type="checkbox" data-task="task-8"> Test student Chromebook access</label>
      <label><input type="checkbox" data-task="task-9"> Check back navigation</label>
      <label><input type="checkbox" data-task="task-10"> Replace planning checklist with student-facing activities before launch</label>
      <button id="reset" type="button">Reset checklist</button>
      <p><small>Teacher planning only. Progress is stored locally in this browser when available. No grading or submissions.</small></p>
