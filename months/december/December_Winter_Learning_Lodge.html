<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Winter Learning Lodge | LRC Quest
  </title>
  <style>
   *{
box-sizing:border-box}
html,body{
margin:0;
min-height:100%;
font-family:Trebuchet MS,Arial,sans-serif}
body{
min-height:100dvh;
display:grid;
place-items:center;
overflow-x:hidden;
background:radial-gradient(ellipse at 50% 20%,#b8e7ff 0%,#73b7e5 48%,#3776b6 100%);
padding:clamp(8px,2vw,24px)}
.snow{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:0}
.flake{
position:absolute;
top:-10vh;
color:#fff;
opacity:.85;
animation:fall linear infinite;
filter:drop-shadow(0 0 2px #fff)}
@keyframes fall{
to{
transform:translate3d(25px,120vh,0) rotate(180deg)}
}
.lodge{
position:relative;
z-index:1;
width:min(100%,calc((100dvh - 28px)*1.7768),1500px);
aspect-ratio:1672/941;
border:clamp(4px,.8vw,11px) solid #fff;
border-radius:clamp(14px,2.2vw,32px);
overflow:hidden;
background:#b5ddfa;
box-shadow:0 15px 55px #10395e70}
.lodge img{
width:100%;
height:100%;
display:block;
object-fit:fill}
.cabin{
position:absolute;
top:40%;
height:34%;
width:18%;
border-radius:18%;
cursor:pointer;
display:block;
outline-offset:-5px}
.cabin:focus-visible{
outline:5px solid #ffe36d;
background:#ffe36d33}
.cabin:hover{
background:#fff2;
box-shadow:inset 0 0 0 3px #fff8}
.g1{
left:0.7%}
.g2{
left:20.5%}
.g3{
left:40.9%}
.g4{
left:61.2%}
.g5{
left:81.3%}
.sr-only{
position:absolute;
width:1px;
height:1px;
padding:0;
margin:-1px;
overflow:hidden;
clip:rect(0,0,0,0);
white-space:nowrap;
border:0}
@media(max-width:650px){
body{
padding:6px}
.lodge{
width:100%;
border-width:4px;
border-radius:12px}
}
@media(prefers-reduced-motion:reduce){
.flake{
animation:none;
display:none}
}
  </style>
 </head>
 <body>
  <div aria-hidden="true" class="snow" id="snow">
  </div>
  <main aria-label="Winter Learning Lodge: choose your grade" class="lodge">
   <img alt="Paper-cut winter village with five colorful cabins labeled 1st Grade, 2nd Grade, 3rd Grade, 4th Grade, and 5th Grade." src="winter-lodge-village.png"/>
   <a aria-label="Open 1st Grade Winter Learning Lodge" class="cabin g1" href="december-1-dashboard.html">
    <span class="sr-only">
     1st Grade
    </span>
   </a>
   <a aria-label="Open 2nd Grade Winter Learning Lodge" class="cabin g2" href="december-2-dashboard.html">
    <span class="sr-only">
     2nd Grade
    </span>
   </a>
   <a aria-label="Open 3rd Grade Winter Learning Lodge" class="cabin g3" href="december-3-dashboard.html">
    <span class="sr-only">
     3rd Grade
    </span>
   </a>
   <a aria-label="Open 4th Grade Winter Learning Lodge" class="cabin g4" href="december-4-dashboard.html">
    <span class="sr-only">
     4th Grade
    </span>
   </a>
   <a aria-label="Open 5th Grade Winter Learning Lodge" class="cabin g5" href="december-5-dashboard.html">
    <span class="sr-only">
     5th Grade
    </span>
   </a>
  </main>
  <script>
   const snow = document.getElementById('snow');
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    for (let i = 0; i < 65; i++) {
        const f = document.createElement('span');
        f.className = 'flake';
        f.textContent = i % 5 === 0 ? '❄' : '•';
        f.style.left = ((i * 47.31) % 100) + '%';
        f.style.fontSize = (10 + i % 5 * 5) + 'px';
        f.style.animationDuration = (7 + i % 13) + 's';
        f.style.animationDelay = (-i * .49) + 's';
        snow.appendChild(f);
    }
}
  </script>
 </body>
</html>
