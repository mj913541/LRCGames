<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great Winter Library Quest — Grade 2</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b49;color:#fff;font-family:'Trebuchet MS',Arial,sans-serif;display:flex;justify-content:center;padding:12px}main{width:min(1050px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(19px,3vw,29px);margin:5px}#status{font-weight:bold;color:#d4f4ff}canvas{display:block;width:100%;aspect-ratio:16/9;background:#bce8f6;border:4px solid #e6f8ff;border-radius:16px;touch-action:none}button{border:0;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:bold;background:#f8d978;color:#20354a;cursor:pointer}button:hover{filter:brightness(1.07)}#buttons{display:flex;justify-content:center;gap:10px;margin:9px;flex-wrap:wrap}#hint{min-height:22px;text-align:center;color:#d7f6ff}#overlay{position:fixed;inset:0;background:#071c31d9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}#panel{width:min(720px,100%);background:linear-gradient(#e7faff,#c2e8f6);border:5px solid white;border-radius:24px;color:#183c57;text-align:center;padding:22px;box-shadow:0 14px 45px #0008}#panel h2{font-size:30px;margin:4px}#panel p{font-size:19px;line-height:1.4}#choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:15px}.choice{background:white;border:3px solid #73b6d5;min-width:140px}#bridge{display:flex;gap:9px;justify-content:center;margin:18px 0;flex-wrap:wrap}.slot{width:75px;height:82px;border:4px dashed #4399c6;border-radius:12px;background:#fff9;display:grid;place-items:center;font-size:33px;font-weight:bold;color:#145074;cursor:pointer}.slot.filled{border-style:solid;background:#e7fbff}#tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.tile{width:70px;height:72px;background:#69b9e1;border:3px solid white;border-radius:12px;display:grid;place-items:center;font-size:32px;font-weight:bold;color:#08334d;cursor:grab;touch-action:none}.selected{outline:5px solid #f6c84d}#controls{display:flex;justify-content:center;gap:8px;margin:8px}.arrow{width:55px;height:50px;padding:5px}#controls button{background:#d6f3ff}small{color:#d0edff}#feedback{min-height:25px;font-weight:bold;color:#15587a}</style></head><body><main><header><h1>🦊 The Great Winter Library Quest</h1><span id="status">Level 1 • ❄️ 0</span></header><canvas id="game" width="960" height="540" aria-label="Winter library adventure"></canvas><div id="hint">Use arrow keys or WASD to move. Walk up to glowing objects!</div><div id="buttons"><button id="restart">↻ Restart</button><button id="sound">🔊 Read clues: On</button></div><div id="controls"><button class="arrow" data-key="ArrowLeft">◀</button><button class="arrow" data-key="ArrowUp">▲</button><button class="arrow" data-key="ArrowDown">▼</button><button class="arrow" data-key="ArrowRight">▶</button></div><small>Standalone game • no sign-in, grades, or saved student data • keyboard and on-screen controls</small></main><div id="overlay"><div id="panel"><h2 id="heading"></h2><p id="desc"></p><div id="choices"></div><div id="bridge"></div><div id="tiles"></div><p id="feedback"></p><button id="action">Let's Play!</button></div></div><script>
(()=>{'use strict';const C=document.querySelector('#game'),ctx=C.getContext('2d'),ov=document.querySelector('#overlay'),heading=document.querySelector('#heading'),desc=document.querySelector('#desc'),choices=document.querySelector('#choices'),bridge=document.querySelector('#bridge'),tiles=document.querySelector('#tiles'),feedback=document.querySelector('#feedback'),action=document.querySelector('#action'),status=document.querySelector('#status'),hint=document.querySelector('#hint');let level=1,stars=0,px=90,py=260,keys={},objects=[],solved=0,carried=null,active=null,locked=false,speech=true,bridgeRound=0,placed=[],selected=null,bonusDone=false,bonusOpen=false,bonusFlakes=[],obstacles=[];const W=960,H=540;
function setupExtras(){bonusDone=false;bonusOpen=false;bonusFlakes=[{x:120,y:445},{x:310,y:240},{x:505,y:455},{x:585,y:105},{x:635,y:315},{x:920,y:465}].map((p,i)=>({...p,id:i,taken:false}));obstacles=[{x:245,y:155,w:80,h:105},{x:430,y:265,w:125,h:55},{x:550,y:365,w:80,h:85},{x:355,y:90,w:90,h:70},{x:95,y:315,w:105,h:50}];}
function collision(x,y){return obstacles.some(o=>x+19>o.x&&x-19<o.x+o.w&&y+19>o.y&&y-19<o.y+o.h)}
function bonusRoom(){if(bonusDone||bonusOpen||carried!==null)return;bonusOpen=true;locked=true;panel('🌟 Secret Snowflake Den!','You discovered the hidden winter den! Which book belongs in nonfiction?','',()=>{});action.style.display='none';['A true guide to animal tracks','A story about a flying fox'].forEach((label,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{if(i){feedback.textContent='Try again! Nonfiction teaches real facts.';speak('Try again!');return}bonusDone=true;stars+=40;status.textContent=`Level 2 • ❄️ ${stars}`;feedback.textContent='Secret bonus complete! +40 snowflakes!';speak('Amazing! Secret bonus complete!');setTimeout(()=>{bonusOpen=false;close();hint.textContent='Secret bonus earned! Keep rescuing the books.'},950)};choices.append(b)})}

const speak=t=>{if(!speech||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u)};
function panel(title,text,btn,fn){ov.style.display='flex';heading.textContent=title;desc.textContent=text;choices.innerHTML='';bridge.innerHTML='';tiles.innerHTML='';feedback.textContent='';action.style.display='inline-block';action.textContent=btn;action.onclick=fn;speak(text)}function close(){ov.style.display='none';locked=false}function setLevel(n){level=n;solved=0;carried=null;px=75;py=265;locked=false;status.textContent=`Level ${n} • ❄️ ${stars}`;if(n===1){objects=[{x:230,y:140,kind:'clue',id:0},{x:455,y:390,kind:'clue',id:1},{x:700,y:145,kind:'clue',id:2},{x:825,y:390,kind:'clue',id:3}];hint.textContent='Explore the snowy maze. Find four glowing snowflakes and solve the clues!';panel('Level 1: Snowy Library Maze','Find four magical snowflakes. Each one holds a library clue that opens the way forward.','Start Exploring',close)}else if(n===2){setupExtras();objects=[{x:205,y:115,kind:'book',id:0},{x:370,y:405,kind:'book',id:1},{x:650,y:130,kind:'book',id:2},{x:780,y:390,kind:'book',id:3}];hint.textContent='Find a lost book, then carry it to the correct shelf: Fiction or Nonfiction.';panel('Level 2: Frozen Shelf Rescue','Find and carry four books to their shelves! Navigate around snowy obstacles, collect bonus snowflakes, and discover the secret golden snowflake.','Start Rescuing',close)}else{hint.textContent='Drag letters onto the empty ice bridge spaces, or tap a letter and then a space.';panel('Level 3: Alphabet Mountain','Build five alphabet bridges using letters only. Place the letters in ABC order to help the fox cross!','Build Bridges',()=>{close();startBridge()})}}
const questions=[{q:'Which book would tell you real facts about polar bears?',a:['A story about a talking bear','A book about how polar bears live'],correct:1},{q:'A book has made-up characters and an imaginary adventure. What kind of book is it?',a:['Fiction','Nonfiction'],correct:0},{q:'Which book helps you learn true facts about snowflakes?',a:['A science book about snow','A fairy tale about magical snow'],correct:0},{q:'A fox flies to the moon in a story. Is that fiction or nonfiction?',a:['Nonfiction','Fiction'],correct:1}];const books=[{name:'The Dancing Snowman',type:'Fiction',why:'A snowman dancing is an imaginary story.'},{name:'Facts About Penguins',type:'Nonfiction',why:'This book teaches real penguin facts.'},{name:'The Fox Who Wore Skates',type:'Fiction',why:'This is a made-up animal adventure.'},{name:'How Ice Forms',type:'Nonfiction',why:'This book explains real science.'}];
function ask(i){locked=true;let q=questions[i];panel('❄️ Snowflake Clue',q.q,'',()=>{});action.style.display='none';q.a.forEach((a,k)=>{let b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>{if(k!==q.correct){feedback.textContent='Try again! Think about real facts versus make-believe.';speak('Try again!');return}objects=objects.filter(o=>o.id!==i);solved++;stars+=10;status.textContent=`Level 1 • ❄️ ${stars}`;feedback.textContent='Correct! +10 snowflakes';speak('Great job!');setTimeout(()=>{if(solved===4){panel('Maze Complete!','You found all four snowflakes and unlocked the frozen library!','Next Level →',()=>setLevel(2))}else close()},700)};choices.append(b)})}
function pickup(i){let b=books[i];carried=i;objects=objects.filter(o=>o.id!==i);hint.textContent=`Carrying: ${b.name}. Find the ${b.type} shelf!`;speak('You found '+b.name+'. Find its shelf!')}
function deliver(type){if(carried===null)return;let b=books[carried];locked=true;panel('📚 Return the Book',`You found “${b.name}.” Is the ${type} shelf the right place?`,'',()=>{});action.style.display='none';['Put it here','Keep looking'].forEach((v,i)=>{let bt=document.createElement('button');bt.className='choice';bt.textContent=v;bt.onclick=()=>{if(i===1){close();return}if(type!==b.type){feedback.textContent='Not quite! Try the other shelf.';speak('Try the other shelf!');return}stars+=15;solved++;carried=null;status.textContent=`Level 2 • ❄️ ${stars}`;feedback.textContent=b.why+' +15 snowflakes';speak('Correct! '+b.why);setTimeout(()=>{if(solved===4)panel('Shelves Saved!','All four books are safe and back where they belong!','Climb Alphabet Mountain →',()=>setLevel(3));else{hint.textContent='Great rescue! Find another lost book.';close()}},1000)};choices.append(bt)})}
const rounds=[['D','E','F'],['J','K','L','M'],['P','Q','R','S'],['A','B','C','D'],['W','X','Y','Z']];let pool=[];
function startBridge(){locked=true;ov.style.display='flex';let letters=rounds[bridgeRound];heading.textContent=`🧊 Ice Bridge ${bridgeRound+1} of ${rounds.length}`;desc.textContent='Drag or tap the letters into the empty bridge spaces in ABC order!';speak(desc.textContent);choices.innerHTML='';action.style.display='none';feedback.textContent='';placed=letters.map(()=>null);pool=[...letters].sort(()=>Math.random()-.5);if(pool.join('')===letters.join(''))pool.reverse();drawBridge()}
function drawBridge(){bridge.innerHTML='';tiles.innerHTML='';placed.forEach((v,i)=>{let s=document.createElement('div');s.className='slot'+(v?' filled':'');s.textContent=v||'❄';s.dataset.i=i;s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();put(e.dataTransfer.getData('text/plain'),i)};s.onclick=()=>{if(selected!==null)put(selected,i);else if(v){pool.push(v);placed[i]=null;drawBridge()}};bridge.append(s)});pool.forEach(v=>{let t=document.createElement('div');t.className='tile'+(selected===v?' selected':'');t.textContent=v;t.draggable=true;t.ondragstart=e=>e.dataTransfer.setData('text/plain',v);t.onclick=()=>{selected=v;drawBridge()};tiles.append(t)});if(placed.every(Boolean)){let check=document.createElement('button');check.textContent='Check My Bridge ✓';check.onclick=()=>{if(placed.join('')===rounds[bridgeRound].join('')){stars+=20;status.textContent=`Level 3 • ❄️ ${stars}`;feedback.textContent='Perfect ABC order! The fox crosses the bridge!';speak('Perfect! Bridge complete!');check.disabled=true;setTimeout(()=>{bridgeRound++;if(bridgeRound<rounds.length)startBridge();else panel('🏆 Winter Library Champion!','You explored the maze, rescued the books, and built every alphabet bridge. Amazing work!','Play Again',restart)},1300)}else{feedback.textContent='The ice is wobbling! Check your ABC order and try again.';speak('Try again. Check your ABC order.')}};choices.append(check)}else choices.innerHTML=''}
function put(v,i){if(!v||!pool.includes(v))return;if(placed[i])pool.push(placed[i]);placed[i]=v;pool.splice(pool.indexOf(v),1);selected=null;feedback.textContent='';drawBridge()}
function restart(){stars=0;bridgeRound=0;setLevel(1)}document.querySelector('#restart').onclick=restart;document.querySelector('#sound').onclick=()=>{speech=!speech;document.querySelector('#sound').textContent=speech?'🔊 Read clues: On':'🔇 Read clues: Off';if(!speech&&'speechSynthesis'in window)speechSynthesis.cancel()};window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true});window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>keys[k]=false);b.addEventListener('pointercancel',()=>keys[k]=false)});
function rounded(x,y,w,h,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill()}function text(t,x,y,size=23,color='#173c56'){ctx.font=`bold ${size}px Trebuchet MS`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(t,x,y)}function draw(){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#8ccbe9');grad.addColorStop(1,'#e5f9ff');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<28;i++){let x=(i*173+44)%W,y=(i*89+23)%H;text('✳',x,y,12,'#ffffff99')}for(let i=0;i<9;i++){let x=i*120+35;ctx.fillStyle='#5a9f99';ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x+28,20);ctx.lineTo(x+56,100);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+10,92,35,7)}rounded(12,12,936,516,'#ffffff26');if(level===1){text('Find the four magical snowflakes!',480,48,28);for(let i=0;i<6;i++){let x=130+i*142,y=i%2?220:320;rounded(x,y,45,115,'#7aaab4');text('🌲',x+22,y+75,45)}objects.forEach(o=>{text('❄️',o.x,o.y+12,39);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,28,0,Math.PI*2);ctx.stroke()})}if(level===2){text('Rescue books • Dodge obstacles • Collect snowflakes!',480,45,25);obstacles.forEach((o,i)=>{rounded(o.x,o.y,o.w,o.h,i%2?'#8bd0e8':'#f7fcff');text(i%2?'🧊':'☃',o.x+o.w/2,o.y+o.h/2+13,35)});bonusFlakes.forEach(f=>{if(!f.taken)text('❄️',f.x,f.y,30)});if(!bonusDone)text('🌟',610,470,40);rounded(700,205,200,90,'#805c48');rounded(700,315,200,90,'#805c48');text('📖 FICTION',800,255,26,'white');text('📘 NONFICTION',800,366,23,'white');objects.forEach(o=>{text('📕',o.x,o.y,39);text('✦',o.x+23,o.y-27,22,'#fff')});if(carried!==null)text('📚 '+books[carried].name,480,80,20)}if(level===3){text('Alphabet Mountain',480,50,30);text('🏔️      🧊     🧊     🧊      🏔️',480,260,64)}text('🦊',px,py+15,48);if(carried!==null)text('📗',px+32,py-8,28)}let last=0;function loop(t){let dt=Math.min((t-last)/16.7||1,2);last=t;if(!locked&&level<3){let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let len=Math.hypot(dx,dy)||1;let nx=Math.max(35,Math.min(W-35,px+dx/len*4*dt)),ny=Math.max(85,Math.min(H-35,py+dy/len*4*dt));if(level!==2||!collision(nx,py))px=nx;if(level!==2||!collision(px,ny))py=ny;if(level===1){let o=objects.find(o=>Math.hypot(px-o.x,py-o.y)<43);if(o)ask(o.id)}else if(level===2){bonusFlakes.forEach(f=>{if(!f.taken&&Math.hypot(px-f.x,py-f.y)<35){f.taken=true;stars+=5;status.textContent=`Level 2 • ❄️ ${stars}`;hint.textContent='Bonus snowflake! +5 points ❄️'}});if(!bonusDone&&Math.hypot(px-610,py-470)<38&&carried===null){bonusRoom()}else if(carried===null){let o=objects.find(o=>Math.hypot(px-o.x,py-o.y)<43);if(o)pickup(o.id)}else if(px>695&&px<920&&py>185&&py<415){deliver(py<305?'Fiction':'Nonfiction')}}}draw();requestAnimationFrame(loop)}panel('❄️ Welcome to the Winter Library Quest!','Help our fox librarian explore a snowy maze, rescue misplaced books, and build alphabet bridges. Use arrow keys or WASD to move.','Start Level 1',()=>setLevel(1));requestAnimationFrame(loop);
})();</script></body></html>
