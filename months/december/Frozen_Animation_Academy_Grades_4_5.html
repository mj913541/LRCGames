<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frozen Animation Academy | Grades 4–5</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(#b9dff5,#f0faff);color:#16354d}main{max-width:1020px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}h1{font-size:clamp(20px,3vw,32px);margin:8px 0}.pill{background:white;border:2px solid #7db7d9;border-radius:22px;padding:8px 12px;font-weight:bold}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#stage{position:relative;border:5px solid #559bc4;border-radius:18px;overflow:hidden;background:#d9f2ff}canvas{display:block;width:100%;height:auto}#modal{display:none;position:absolute;inset:0;background:#17344fbd;align-items:center;justify-content:center;padding:12px;z-index:5}#modal.open{display:flex}.panel{width:min(650px,100%);max-height:100%;overflow:auto;background:white;border:4px solid #8ccce9;border-radius:20px;text-align:center;padding:18px;box-shadow:0 8px 0 #184867}h2{margin:5px 0 10px}p{line-height:1.4}button{border:0;background:#176d9e;color:white;font:700 16px Trebuchet MS,Arial;border-radius:12px;padding:11px 16px;cursor:pointer}button:hover{background:#10547b}button:focus-visible{outline:3px solid #ffbd4b}.secondary{background:#d9effa;color:#153b53;border:2px solid #72b1d3}.choices{display:grid;gap:9px;margin:12px auto;max-width:520px}.choices button{width:100%}#tiles,#slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px auto}.tile,.slot{width:clamp(92px,17vw,130px);min-height:78px;border-radius:12px;padding:8px;display:grid;place-items:center;font-weight:bold;font-size:14px}.tile{background:#b9e5fa;border:3px solid #478cb4;cursor:grab;touch-action:manipulation}.tile.sel{outline:4px solid #f4ad3e}.slot{border:3px dashed #4d96b9;background:#f1faff;cursor:pointer}.slot.filled{border-style:solid;background:#d9f4ff}#controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}#pad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,42px);gap:3px}#pad button{padding:4px;font-size:20px}#pad [data-dir=up]{grid-column:2}#pad [data-dir=left]{grid-column:1;grid-row:2}#pad [data-dir=down]{grid-column:2;grid-row:2}#pad [data-dir=right]{grid-column:3;grid-row:2}#message{font-weight:bold;font-size:14px}footer{font-size:13px;color:#46687b;margin:10px 0}@media(max-width:600px){.panel{padding:10px}.tile,.slot{width:90px;min-height:72px}}
</style></head><body><main><header><h1>🦊❄️ Frozen Animation Academy</h1><div class="row"><span class="pill" id="level">Level 1 / 3</span><span class="pill" id="score">❄️ 0</span><button class="secondary" id="help">How to Play</button></div></header><div id="stage"><canvas id="canvas" width="960" height="560" aria-label="Top-down snowy academy maze game"></canvas><div id="modal"><div class="panel" id="panel"></div></div></div><div id="controls"><div id="message" aria-live="polite">Explore the academy. Walk near glowing machines to investigate!</div><div id="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><footer>Arrow keys or WASD to move • Walk near glowing objects to interact • Drag or tap puzzle pieces • Self-checking, no sign-in or grading • Winter only</footer></main><script>
(()=>{'use strict';const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),modal=document.getElementById('modal'),panel=document.getElementById('panel'),msg=document.getElementById('message'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level');const TILE=40,COLS=24,ROWS=14;let level=0,score=0,player={x:1,y:1},items=[],walls=[],done=new Set(),busy=false,selected=null,dragged=null,slots=[],puzzle=null,frame=0;const levels=[{name:'Frozen Hallways',map:["########################","#....#......#.........#","#....#......#.........#","#...........#.........#","#....#................#","###.####.#####.#####..#","#..............#......#","#..............#......#","#...#####.####.#......#","#...#.........#.......#","#.............#.......#","#.............#.......#","#.....................#","########################"],objects:[{x:3,y:2,id:'l1a',type:'question',label:'Slide Duplicator',q:'Which action creates a copy of a slide so you can change just one part of the picture?',a:['Duplicate the slide','Delete the slide','Change the theme'],correct:0,tip:'Duplicating preserves the previous frame.'},{x:10,y:2,id:'l1b',type:'question',label:'Motion Sensor',q:'To make a snowball appear to roll smoothly, what should change a little on each slide?',a:['The file name','The snowball position','The slide size'],correct:1,tip:'Small position changes create smooth movement.'},{x:19,y:3,id:'question',type:'question',label:'Size Machine',q:'To show an apple growing in stop-motion, what changes between frames?',a:['The apple size','The number of slides in the file name','The background color every time'],correct:0,tip:'Gradually enlarge the same object.'},{x:7,y:10,id:'l1d',type:'question',label:'Frame Console',q:'What is a frame in a Google Slides stop-motion project?',a:['A single slide showing one moment','Only the first slide','The border around a picture'],correct:0,tip:'Each slide is one frame.'}],snow:[[2,11],[7,3],[13,7],[20,10],[21,2],[9,12]],bonus:[18,11]},{name:'Stop-Motion Workshop',map:["########################","#...........#.........#","#..####.....#.........#","#.....#...............#","#.....#...............#","#.....####.#######....#","#.....................#","#...#######...........#","#...#.....#..#####....#","#.........#...........#","#.........#...........#","#.....................#","#.....................#","########################"],objects:[{x:3,y:3,id:'l2a',type:'puzzle',label:'Rolling Snowball',prompt:'Put the frames in order to make the snowball move left to right.',parts:['⚪ · · ·','· ⚪ · ·','· · ⚪ ·','· · · ⚪'],order:[0,1,2,3]},{x:18,y:3,id:'l2b',type:'question',label:'Frozen Playback',q:'Your animation looks jumpy. Which change would usually help?',a:['Move objects smaller distances between frames','Remove every other frame','Move the object randomly'],correct:0,tip:'Small changes between slides look smoother.'},{x:17,y:10,id:'l2c',type:'puzzle',label:'Growing Crystal',prompt:'Arrange the crystal frames from smallest to largest.',parts:['◆ tiny','◆◆ small','◆◆◆ medium','◆◆◆◆ large'],order:[0,1,2,3]},{x:7,y:11,id:'l2d',type:'question',label:'Background Lock',q:'Why keep the same background on each slide of a stop-motion scene?',a:['To keep the scene steady while the subject moves','To make every slide unrelated','To hide the moving object'],correct:0,tip:'A consistent background makes motion easier to see.'}],snow:[[2,10],[10,3],[14,6],[21,11],[7,6],[19,7]],bonus:[21,2]},{name:'Crystal Animation Vault',map:["########################","#...........#.........#","#..######...#.........#","#...........#.........#","#...........#.........#","#..####.######.####...#","#..............#......#","#..............#......#","#.....####.....#......#","#.....#...............#","#.....................#","#.....................#","#.....................#","########################"],objects:[{x:4,y:3,id:'l3a',type:'puzzle',label:'Spin Frames',prompt:'Order the arrow frames to make one clockwise turn.',parts:['↑ Up','→ Right','↓ Down','← Left'],order:[0,1,2,3]},{x:19,y:3,id:'l3b',type:'question',label:'Sequence Decoder',q:'An object is at the left, then center, then right. What will the viewer see?',a:['The object moving right','The object shrinking','The object disappearing'],correct:0,tip:'Frame order controls the apparent movement.'},{x:9,y:10,id:'l3c',type:'puzzle',label:'Final Crystal',prompt:'Rebuild the final four-frame animation: the snowflake grows, one size at a time.',parts:['❄ tiny','❄ small','❄ medium','❄ large'],order:[0,1,2,3]},{x:20,y:10,id:'l3d',type:'question',label:'Vault Key',q:'What is the best way to check whether your stop-motion animation works?',a:['Play the slideshow and watch the motion','Only look at the last slide','Rename the file'],correct:0,tip:'Preview the whole sequence to spot mistakes.'}],snow:[[2,11],[11,3],[14,9],[21,7],[5,6],[18,12]],bonus:[21,2]}];
function loadLevel(n){level=n;player={x:1,y:1};done=new Set();busy=false;items=levels[n].objects.map((o,i)=>({...o,id:o.id||'l'+n+'_'+i}));levels[n].snow.forEach((p,i)=>items.push({x:p[0],y:p[1],id:'snow'+i,type:'snow'}));let b=levels[n].bonus;items.push({x:b[0],y:b[1],id:'bonus',type:'bonus'});walls=levels[n].map;levelEl.textContent=`Level ${n+1} / 3 — ${levels[n].name}`;msg.textContent='Explore the maze and restore all four glowing machines!';draw()}
function walkable(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS&&walls[y][x]!== '#'}function move(dx,dy){if(busy)return;const nx=player.x+dx,ny=player.y+dy;if(walkable(nx,ny)){player.x=nx;player.y=ny;checkItems();draw()}}function addScore(n){score+=n;scoreEl.textContent='❄️ '+score}function checkItems(){for(const it of items){if(done.has(it.id))continue;if(it.x===player.x&&it.y===player.y){if(it.type==='snow'){done.add(it.id);addScore(5);msg.textContent='Snowflake found! +5';continue}if(it.type==='bonus'){done.add(it.id);addScore(30);show('Secret Snowflake!','You discovered a hidden bonus! +30 snowflakes.',[{label:'Keep Exploring',fn:close}]);return}}}for(const it of items){if(done.has(it.id)||it.type==='snow'||it.type==='bonus')continue;if(Math.abs(it.x-player.x)+Math.abs(it.y-player.y)<=1){openChallenge(it);return}}}
function show(title,body,buttons){busy=true;modal.classList.add('open');panel.innerHTML='';const h=document.createElement('h2');h.textContent=title;panel.append(h);if(typeof body==='string'){const p=document.createElement('p');p.textContent=body;panel.append(p)}else if(body)panel.append(body);const c=document.createElement('div');c.className='choices';buttons.forEach(b=>{const btn=document.createElement('button');btn.textContent=b.label;btn.className=b.secondary?'secondary':'';btn.onclick=b.fn;c.append(btn)});panel.append(c)}function close(){modal.classList.remove('open');busy=false;draw()}function openChallenge(it){if(it.type==='question'){show('🔧 '+it.label,it.q,it.a.map((a,i)=>({label:a,fn:()=>{if(i===it.correct)success(it);else show('Try Again! ❄️',it.tip,[{label:'Try the Question Again',fn:()=>openChallenge(it)},{label:'Keep Exploring',fn:close,secondary:true}])}})))}else openPuzzle(it)}function success(it){done.add(it.id);addScore(20);show('Machine Restored! ✨',it.label+' is working again! +20 snowflakes.',[{label:'Keep Exploring',fn:()=>{close();checkCompletion()}}])}function openPuzzle(it){puzzle=it;slots=Array(it.parts.length).fill(null);selected=null;renderPuzzle()}
function renderPuzzle(){const it=puzzle;const body=document.createElement('div');const instruction=document.createElement('p');instruction.textContent=it.prompt+' Drag a tile to an empty frame, or tap a tile then tap a frame.';body.append(instruction);const target=document.createElement('div');target.id='slots';slots.forEach((value,i)=>{const el=document.createElement('div');el.className='slot'+(value!==null?' filled':'');el.textContent=value===null?'Frame '+(i+1):it.parts[value];el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();place(Number(e.dataTransfer.getData('text/plain')),i)};el.onclick=()=>{if(selected!==null)place(selected,i);else if(value!==null){slots[i]=null;renderPuzzle()}};target.append(el)});body.append(target);const supply=document.createElement('div');supply.id='tiles';const shuffled=[2,0,3,1];shuffled.forEach(idx=>{if(slots.includes(idx))return;const el=document.createElement('div');el.className='tile'+(selected===idx?' sel':'');el.textContent=it.parts[idx];el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData('text/plain',String(idx));el.onclick=()=>{selected=idx;renderPuzzle()};supply.append(el)});body.append(supply);const feedback=document.createElement('p');feedback.id='puzzleFeedback';feedback.setAttribute('aria-live','polite');body.append(feedback);show('🧩 '+it.label,body,[{label:'Check My Animation',fn:()=>{if(slots.some(x=>x===null)){feedback.textContent='Fill every frame first!';return}if(slots.every((v,i)=>v===it.order[i]))success(it);else{feedback.textContent='Not quite! Watch the direction or size changes. Move the frames and try again.'}}},{label:'Keep Exploring',fn:close,secondary:true}])}function place(tile,i){if(!Number.isInteger(tile)||tile<0||tile>=puzzle.parts.length)return;const old=slots.indexOf(tile);if(old>=0)slots[old]=null;slots[i]=tile;selected=null;renderPuzzle()}
function checkCompletion(){if(levels[level].objects.every(o=>done.has(o.id))){if(level<2)show('Level Complete! 🎉','All four machines are restored. The next section of the academy is open!',[{label:'Enter Next Level',fn:()=>{close();loadLevel(level+1)}}]);else show('Academy Saved! 🦊❄️','You restored every animation system! You are a Winter Animation Master. No work to turn in—great job!',[{label:'Play Again',fn:()=>{close();score=0;scoreEl.textContent='❄️ 0';loadLevel(0)}},{label:'Stay and Explore',fn:close,secondary:true}])}}
function draw(){ctx.clearRect(0,0,960,560);const colors=['#e8f8ff','#d4edfa'];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=x*TILE,py=y*TILE;if(walls[y][x]==='#'){ctx.fillStyle='#6da6c8';ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle='#a8d6ed';ctx.fillRect(px+3,py+3,TILE-6,8);ctx.fillStyle='#4e88b4';ctx.fillRect(px+4,py+15,TILE-8,20)}else{ctx.fillStyle=colors[(x+y)%2];ctx.fillRect(px,py,TILE,TILE);ctx.fillStyle='#ffffff88';ctx.fillRect(px+8,py+8,4,4)}}for(const it of items){if(done.has(it.id))continue;ctx.font=it.type==='snow'?'25px Arial':'29px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.type==='snow'?'❄️':it.type==='bonus'?'🌟':it.type==='puzzle'?'🧩':'💠',it.x*TILE+20,it.y*TILE+20)}ctx.font='31px Arial';ctx.fillText('🦊',player.x*TILE+20,player.y*TILE+19);ctx.textAlign='left';ctx.textBaseline='alphabetic'}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();move(...dirs[k])}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};move(...d[b.dataset.dir])});document.getElementById('help').onclick=()=>show('How to Play','Explore with arrow keys, WASD, or on-screen arrows. Walk next to glowing machines to solve challenges. Collect snowflakes for bonus points. All four machines must be restored to advance. For frame puzzles, drag or tap tiles into empty spaces.',[{label:'Let’s Explore!',fn:close}]);loadLevel(0);show('Welcome to the Frozen Animation Academy!','The winter storm has frozen the academy’s animation machines. Explore three mazes, solve Google Slides animation puzzles, and bring the academy back to life!',[{label:'Start Adventure!',fn:close}]);})();
</script></body></html>
