<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works of Choice</title>
    <style>
        body {
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            color: #333;
        }
        h1 {
            text-align: center;
            color: red;
            font-weight: 900;
            animation: colorChange 2s infinite;
        }
        @keyframes colorChange {
            0% { color: #ff5722; }
            50% { color: #4caf50; }
            100% { color: #ff5722; }
        }
        .month-section {
            border: 4px solid black;
            border-radius: 20px;
            margin: 20px auto;
            padding: 10px;
            max-width: 1000px;
            background-color: #ffffff;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            animation: bounceIn 1.5s;
        }

        .month-section h2 img {
    display: block;
    margin: 0 auto; /* Centers the image horizontally */
    max-width: 90%; /* Ensures the image doesn't overflow */
    height: auto; /* Maintains the aspect ratio */
}

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .month-section h2 {
            text-align: center;
            color: #2196f3;
        }
        .game-grid {
    display: flex; /* Change grid layout to flexbox */
    justify-content: space-around; /* Evenly distribute items with space between them */
    align-items: center; /* Center items vertically (if needed) */
    gap: 5px; /* Optional: Adds spacing between items */
    flex-wrap: wrap; /* Ensures items wrap to the next row if the container is too narrow */
}
.game {
    flex: 1; /* Makes each game item take up equal width */
    text-align: center; /* Centers text and images within each game */
    max-width: 200px; /* Optional: Limits the width of each game item */
}
.game img {
    width: 100%; /* Ensures images fill the available space */
    height: auto; /* Maintains aspect ratio */
    border: 2px solid black;
    border-radius: 20px;
}
        .game img:hover {
            transform: scale(1.1);
        }
        .game a {
            text-decoration: none;
            color: red;
            font-size: 18px;
            font-display: bold;
            display: block;
            margin-top: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #4caf50;
            color: #fff;
        }
        .hidden {display: none;}

    </style>
</head>
<body>
    <h1>Works of Choice</h1>

    <!-- August & September -->
    <div class="month-section">
        <h2><img src="../img/monthSigns/augustSeptemberChoices.jpg" alt="August September"></h2>
        <div class="game-grid">
            <div class="game">
                <a href="../skill-worlds/book-parts-adventure.html" target="_blank">
                    <img src="../img/picturesForLinks/book-parts-adventure.png" alt="Book Parts Adventure!">
                </a><a href="../skill-worlds/book-parts-adventure.html">Book Parts Adventure!</a>
            </div>

            <div class="game">
                <a href="../skill-worlds/book-parts-bonanza.html" target="_blank">
                    <img src="../img/picturesForLinks/book-parts-bonanza.png" alt="Book Parts Bonanza">
                </a><a href="../skill-worlds/book-parts-bonanza.html">Brook Parts Bonanza!</a>
            </div>

            <div class="game">
                <a href="../skill-worlds/book-care-matching.html" target="_blank">
                    <img src="../img/picturesForLinks/book-care-matching.png" alt="Book Care Matching">
                </a><a href="../skill-worlds/book-care-matching.html">Book Care Matching</a>
            </div>

        </div>
    </div>









</div>

    <footer>
        ©  Works of Choice
