<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book Parts Bonanza | Mrs. Albrecht's LRC</title>
<style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#24334c;background:#f6f3ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #f4a340;outline-offset:3px}.app{height:100dvh;display:flex;flex-direction:column;gap:clamp(5px,1vh,12px);padding:clamp(8px,1.5vh,16px);max-width:1500px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}.brand{font-size:clamp(17px,2.8vw,29px);font-weight:1000;color:#593d91;white-space:nowrap}.tag{font-size:clamp(10px,1.25vw,14px);color:#67738c}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{border:2px solid #ddd4f3;background:#fff;border-radius:999px;padding:8px 12px;font-weight:900;color:#4d4380;font-size:clamp(11px,1.4vw,15px)}.pill.active{background:#e3d6ff;border-color:#9471dd}.mission{background:#fff;border:3px solid #e9dcff;border-radius:23px;display:flex;align-items:center;gap:clamp(7px,2vw,20px);padding:clamp(7px,1.3vh,15px);flex-shrink:0;min-height:96px;box-shadow:0 5px 0 #e8e1f6}.missionIcon{width:clamp(60px,10vh,94px);height:clamp(60px,10vh,94px);object-fit:contain}.missionText{flex:1;min-width:0}.eyebrow{font-size:clamp(10px,1.5vw,14px);font-weight:900;color:#7d6aab;letter-spacing:.06em}.missionTitle{font-size:clamp(17px,3.5vw,35px);line-height:1.1;font-weight:1000;color:#3e3371}.missionSub{font-size:clamp(10px,1.6vw,15px);font-weight:700;color:#7b8398}.progress{display:flex;flex-wrap:wrap;gap:2px;max-width:215px;justify-content:flex-end}.star{font-size:clamp(15px,2.5vw,24px);color:#d4d4df}.star.got{color:#f0ad28;text-shadow:0 1px #d98e12}.arena{position:relative;flex:1;min-height:100px;overflow:hidden;border:4px solid #d8cbfa;border-radius:26px;background:radial-gradient(circle at 15% 20%,#fff9d9 0 7%,transparent 26%),radial-gradient(circle at 85% 85%,#d5f6ef 0 7%,transparent 29%),#eef3ff;isolation:isolate}.arena:before{content:"✦   ✧    ✦    ✧   ✦    ✧    ✦";position:absolute;inset:12px;color:#d8cef8;letter-spacing:4vw;pointer-events:none;white-space:nowrap;overflow:hidden}.item{position:absolute;display:grid;place-items:center;width:clamp(78px,13vw,137px);height:clamp(78px,13vw,137px);padding:6px;border:3px solid #fff;border-radius:22px;background:#fff;box-shadow:0 6px 0 #c4c5e5,0 9px 20px #5d5b8b2b;animation:pop .22s ease-out both;transition:transform .15s,opacity .15s;user-select:none;-webkit-user-select:none}.item:hover{transform:scale(1.06)}.item img{width:100%;height:100%;object-fit:contain;pointer-events:none}.item.good{animation:win .28s forwards;pointer-events:none}.item.bad{animation:shake .3s;border-color:#f07e88}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;font-weight:900;color:#6d6591;font-size:clamp(10px,1.5vw,14px)}.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px;background:#edf0ffcf;backdrop-filter:blur(5px)}.card{width:min(610px,100%);max-height:100%;overflow:auto;background:#fff;border:4px solid #d8c7ff;border-radius:26px;padding:clamp(14px,3vh,28px);text-align:center;box-shadow:0 10px 0 #b9a5e4}.card h1{margin:0 0 8px;font-size:clamp(25px,5vh,43px);color:#5c3e96}.card p{margin:5px 0 12px;font-weight:750;color:#68718a;font-size:clamp(12px,2vh,17px)}.big{background:#7655c4;color:white;border:0;border-radius:18px;padding:13px 24px;font-weight:1000;font-size:clamp(16px,2.5vh,23px);box-shadow:0 5px 0 #51388e;margin:7px}.secondary{background:#eaf8f3;color:#286c61;box-shadow:0 5px 0 #a8d7c8}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0}.choice{background:#f5f0ff;border:2px solid #dfd0ff;border-radius:14px;padding:6px 2px;font-size:clamp(10px,1.6vh,14px);font-weight:900;color:#4c3b82;min-width:0}.choice img{display:block;width:clamp(40px,8vh,67px);height:clamp(40px,8vh,67px);margin:auto}.choice.selected{border-color:#7c59d2;background:#e5d8ff;box-shadow:inset 0 0 0 2px #7c59d2}.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:9px 0}.hint{font-size:12px!important}.toast{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(24px,5vw,45px);font-weight:1000;color:#4c3685;text-shadow:0 2px white;pointer-events:none;animation:toast .8s forwards}.hide{display:none!important}@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes win{to{opacity:0;transform:scale(1.4) rotate(12deg)}}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}@media(max-width:650px){.tag{display:none}.brand{font-size:16px}.pill{padding:6px 8px}.mission{min-height:78px}.missionIcon{width:58px;height:58px}.missionSub{display:none}.progress{max-width:116px}.star{font-size:15px}.item{width:clamp(65px,21vw,100px);height:clamp(65px,21vw,100px)}.bottom span:last-child{display:none}}@media(max-height:520px){.app{gap:4px;padding:5px}.mission{min-height:64px;padding:4px}.missionIcon{width:50px;height:50px}.card{padding:9px}.card h1{font-size:23px}.card p{margin:3px}.choice img{width:39px;height:39px}.choices{margin:5px 0}.big{padding:8px 14px}.item{width:74px;height:74px}}

/* Keep the entire mission menu, including PLAY, inside the visible game area. */
.card{display:flex;flex-direction:column;align-items:stretch;justify-content:center;overflow:hidden;padding:clamp(7px,1.3vh,15px);}
.card h1{font-size:clamp(19px,3.6vh,32px);margin:0 0 3px;line-height:1.12}
.card p{margin:2px 0 4px;font-size:clamp(10px,1.6vh,14px);line-height:1.2}
.choices{grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(3px,.7vh,7px);margin:clamp(3px,.7vh,8px) 0}
.choice{padding:3px 1px;font-size:clamp(9px,1.35vh,12px);line-height:1.12}
.choice img{width:clamp(29px,6.2vh,55px);height:clamp(29px,6.2vh,55px)}
.modes{margin:3px 0;gap:4px}
.modes .pill{padding:clamp(4px,.8vh,8px) 8px;font-size:clamp(10px,1.5vh,14px)}
.card .big{padding:clamp(6px,1.1vh,12px) 18px;margin:3px auto;font-size:clamp(15px,2.4vh,21px)}
.card .hint{font-size:clamp(9px,1.25vh,12px)!important;margin:3px 0 0}
@media(max-height:600px){.card{padding:5px 10px}.card h1{font-size:19px}.card p{margin:1px 0;font-size:10px}.choices{margin:2px 0;gap:3px}.choice img{width:clamp(22px,5vh,34px);height:clamp(22px,5vh,34px)}.choice{font-size:9px;padding:2px 0}.modes{margin:2px 0}.modes .pill{padding:3px 6px}.card .big{padding:5px 13px}.card .hint{font-size:9px!important}}
</style>
</head>
<body>
<div class="app"><header class="top"><div><div class="brand">📚 Book Parts Bonanza!</div><div class="tag">Mrs. Albrecht's LRC • Tap the right book parts!</div></div><div class="controls"><button class="pill" id="sound" aria-pressed="true">🔊 Voice ON</button><button class="pill" id="repeat">🔁 Hear mission</button><button class="pill" id="menu">🏠 Back to Menu</button></div></header>
<section class="mission"><img id="missionIcon" class="missionIcon" alt="Example of the part to collect"><div class="missionText"><div class="eyebrow" id="levelLabel">YOUR MISSION</div><div class="missionTitle" id="missionTitle">Collect all the front covers!</div><div class="missionSub">Tap the right pictures. Leave the wrong ones alone!</div></div><div class="progress" id="progress" aria-label="Collection progress"></div></section>
<main class="arena" id="arena" aria-label="Book part collecting play area"><div class="overlay" id="overlay"><div class="card" id="card"></div></div></main>
<footer class="bottom"><span id="status">Choose a mission to begin! 🌟</span><span>Big pictures • Touch friendly • No scrolling</span></footer></div>
<script>
'use strict';
const PARTS=[['front','Front Covers'],['back','Back Covers'],['spine','Spines'],['title','Titles'],['author','Authors'],['illustrator','Illustrators'],['publisher','Publishers'],['copyright','Copyright Dates']];
const svg=(s)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function bookImage(type,variant=0){
 const colors=[['#ed89a5','#673b89'],['#80cbbb','#3d638c'],['#f4bd72','#9d5385'],['#9bb7f0','#5b528e']];const [a,b]=colors[variant%4];
 const base=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="15" fill="#fffaf1"/>`;
 const end='</svg>';let content='';
 if(type==='front')content=`<rect x="24" y="10" width="73" height="100" rx="5" fill="${b}"/><rect x="30" y="10" width="67" height="100" rx="4" fill="${a}"/><rect x="35" y="19" width="56" height="22" rx="5" fill="#fff6e5"/><text x="63" y="29" text-anchor="middle" font-size="9" font-weight="bold" fill="${b}">THE</text><text x="63" y="38" text-anchor="middle" font-size="9" font-weight="bold" fill="${b}">STORY</text><circle cx="63" cy="68" r="18" fill="#fff0c4"/><path d="M45 78Q62 48 82 78" fill="${b}"/><text x="63" y="100" text-anchor="middle" font-size="8" fill="${b}">A BOOK</text>`;
 if(type==='back')content=`<rect x="24" y="10" width="73" height="100" rx="5" fill="${b}"/><rect x="30" y="10" width="67" height="100" rx="4" fill="${a}"/><rect x="40" y="23" width="47" height="4" rx="2" fill="white"/><rect x="40" y="32" width="43" height="3" rx="1" fill="white"/><rect x="40" y="40" width="48" height="3" rx="1" fill="white"/><rect x="40" y="48" width="37" height="3" rx="1" fill="white"/><rect x="40" y="57" width="44" height="3" rx="1" fill="white"/><rect x="40" y="65" width="39" height="3" rx="1" fill="white"/><rect x="46" y="80" width="36" height="18" fill="white"/>${Array.from({length:13},(_,i)=>`<rect x="${49+i*2.2}" y="83" width="${i%3===0?2:1}" height="12" fill="${b}"/>`).join('')}`;
 if(type==='spine')content=`<rect x="22" y="13" width="21" height="95" rx="3" fill="${a}"/><rect x="47" y="8" width="23" height="100" rx="3" fill="${b}"/><rect x="74" y="17" width="23" height="91" rx="3" fill="#f3bf77"/><g font-size="10" font-weight="bold" fill="white"><text x="36" y="98" transform="rotate(-90 36 98)">STORIES</text><text x="62" y="99" transform="rotate(-90 62 99)">BOOKS</text><text x="89" y="96" transform="rotate(-90 89 96)">READ</text></g>`;
 if(type==='title')content=`<rect x="15" y="15" width="90" height="90" rx="5" fill="${a}"/><rect x="23" y="24" width="74" height="47" rx="5" fill="#fff8df" stroke="${b}" stroke-width="3"/><text x="60" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="${b}">THE BIG</text><text x="60" y="57" text-anchor="middle" font-size="14" font-weight="bold" fill="${b}">ADVENTURE</text><path d="M24 82h73" stroke="${b}" stroke-width="3"/>`;
 if(type==='author')content=`<rect x="15" y="15" width="90" height="90" rx="5" fill="${a}"/><text x="60" y="38" text-anchor="middle" font-size="11" fill="${b}" font-weight="bold">THE STORY</text><circle cx="60" cy="55" r="13" fill="#fff4d8"/><path d="M38 79q22-27 44 0" fill="${b}"/><rect x="20" y="82" width="80" height="18" rx="4" fill="#fff8df" stroke="${b}" stroke-width="2"/><text x="60" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="${b}">BY SAM LEE</text>`;
 if(type==='illustrator')content=`<rect x="12" y="14" width="96" height="92" rx="5" fill="${a}"/><circle cx="60" cy="47" r="20" fill="#fff4d8"/><path d="M45 56q15-23 30 0" fill="${b}"/><rect x="18" y="77" width="84" height="23" rx="4" fill="#fff8df" stroke="${b}" stroke-width="2"/><text x="60" y="87" text-anchor="middle" font-size="8" font-weight="bold" fill="${b}">PICTURES BY</text><text x="60" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="${b}">KIM PARK</text>`;
 if(type==='publisher')content=`<path d="M20 15h75v91H20z" fill="${a}"/><path d="M30 15v91" stroke="${b}" stroke-width="5"/><text x="63" y="36" text-anchor="middle" font-size="10" fill="${b}" font-weight="bold">TITLE PAGE</text><path d="M39 48h47M39 55h47M39 62h37" stroke="white" stroke-width="4"/><rect x="34" y="74" width="56" height="23" rx="3" fill="#fff8df" stroke="${b}" stroke-width="2"/><text x="62" y="84" text-anchor="middle" font-size="8" fill="${b}" font-weight="bold">SUNNY</text><text x="62" y="93" text-anchor="middle" font-size="8" fill="${b}" font-weight="bold">BOOKS</text>`;
 if(type==='copyright')content=`<path d="M17 13h86v94H17z" fill="#fff8e8" stroke="${b}" stroke-width="3"/><path d="M28 29h64M28 38h54M28 47h60M28 56h48" stroke="${a}" stroke-width="4"/><rect x="25" y="68" width="70" height="29" rx="5" fill="${a}"/><text x="60" y="80" text-anchor="middle" font-size="9" font-weight="bold" fill="${b}">©</text><text x="60" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="${b}">${2021+variant%5}</text>`;
 return svg(base+content+end);
}
const $=id=>document.getElementById(id);const arena=$('arena'),overlay=$('overlay'),card=$('card');
let selected=0,mode='little',voice=true,playing=false,collected=0,round=0,spawnTimer=null,active=new Map(),lastPart=-1,gameId=0,spawnsSinceCorrect=0;
const goal=10;const config={little:{interval:1500,lifetime:0,max:5},explorer:{interval:1100,lifetime:5000,max:6},legend:{interval:750,lifetime:2600,max:7}};
const shuffle=a=>a.sort(()=>Math.random()-.5);const random=n=>Math.floor(Math.random()*n);
function say(message){if(!voice||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(message);u.rate=.84;u.pitch=1.12;window.speechSynthesis.speak(u)}
function chime(good){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=good?660:220;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);o.start();o.stop(ctx.currentTime+.18);o.onended=()=>ctx.close()}catch(e){}}
function clearGame(){playing=false;gameId++;spawnsSinceCorrect=0;lastPart=-1;clearInterval(spawnTimer);active.forEach(v=>{clearTimeout(v.timeout);v.el.remove()});active.clear();arena.querySelectorAll('.toast').forEach(e=>e.remove());}
function missionName(){return selected===8?'MIX IT UP!':PARTS[selected][1]}
function target(){return selected===8?round:selected}
function updateHeader(){let t=target();$('missionIcon').src=bookImage(PARTS[t][0]);$('missionTitle').textContent=`Collect all the ${PARTS[t][1].toLowerCase()}!`;$('levelLabel').textContent=selected===8?'MIX IT UP! • RANDOM MISSION':`LEVEL ${selected+1} OF 8`;$('progress').innerHTML=Array.from({length:goal},(_,i)=>`<span class="star ${i<collected?'got':''}" aria-hidden="true">★</span>`).join('');$('progress').setAttribute('aria-label',`${collected} of ${goal} collected`);$('status').textContent=`${collected} / ${goal} collected • ${mode==='little'?'🐢 Little Reader':mode==='explorer'?'🐇 Book Explorer':'🚀 Library Legend'}`}
function goToGameMenu(){window.location.href='./game-index.html'}
function menu(){clearGame();overlay.classList.remove('hide');card.innerHTML=`<h1>📚 Book Parts Bonanza!</h1><p>Choose what to collect!</p><div class="choices">${PARTS.map(([key,label],i)=>`<button class="choice ${selected===i?'selected':''}" data-part="${i}"><img src="${bookImage(key)}" alt=""><span>${esc(label)}</span></button>`).join('')}<button class="choice ${selected===8?'selected':''}" data-part="8"><div style="font-size:38px;line-height:65px">🎲</div><span>MIX IT UP!</span></button></div><p>Choose your speed:</p><div class="modes"><button class="pill ${mode==='little'?'active':''}" data-mode="little">🐢 Little Reader</button><button class="pill ${mode==='explorer'?'active':''}" data-mode="explorer">🐇 Explorer</button><button class="pill ${mode==='legend'?'active':''}" data-mode="legend">🚀 Legend</button></div><button class="big" id="start">▶ PLAY!</button><p class="hint">Tap matching pictures. Wrong taps don't take away stars!<br>🔊 Use Voice ON for spoken missions.</p>`;card.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.part);round=random(8);collected=0;menu()});card.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu()});$('start').onclick=start;updateHeader()}
function start(){clearGame();collected=0;if(selected===8)round=random(8);updateHeader();overlay.classList.add('hide');playing=true;const myGame=gameId;say(`Collect all the ${PARTS[target()][1].toLowerCase()}! Don't collect the wrong parts!`);for(let i=0;i<3;i++)setTimeout(()=>{if(playing&&gameId===myGame)spawn()},i*260);spawnTimer=setInterval(()=>{if(playing&&gameId===myGame)spawn()},config[mode].interval)}
function toast(text){let e=document.createElement('div');e.className='toast';e.textContent=text;arena.append(e);setTimeout(()=>e.remove(),850)}
function removeItem(el){let record=active.get(el);if(!record)return;clearTimeout(record.timeout);active.delete(el);el.remove()}
function spawn(){
 if(!playing)return;
 const t=target();
 const hasCorrect=[...active.values()].some(v=>v.part===t);
 // Never allow the play area to become permanently filled with wrong answers.
 // In Little Reader mode, cards have no expiration, so recycle a distractor.
 if(active.size>=config[mode].max){
   if(hasCorrect)return;
   const distractor=[...active.values()].find(v=>v.part!==t);
   if(distractor)removeItem(distractor.el);
 }
 // A correct picture is always offered, and appears at least every other spawn.
 let p=(!hasCorrect||spawnsSinceCorrect>=1||Math.random()<.43)?t:random(8);
 if(p!==t&&p===lastPart)p=t;
 if(p===t)spawnsSinceCorrect=0;else spawnsSinceCorrect++;
 lastPart=p;let el=document.createElement('button');el.type='button';el.className='item';el.setAttribute('aria-label',`Book part picture: ${PARTS[p][1]}`);let img=document.createElement('img');img.alt='';img.src=bookImage(PARTS[p][0],random(4));el.append(img);arena.append(el);let size=el.getBoundingClientRect(),bounds=arena.getBoundingClientRect(),margin=9;let maxX=Math.max(margin,bounds.width-size.width-margin*2),maxY=Math.max(margin,bounds.height-size.height-margin*2);let pos=null;for(let i=0;i<24;i++){let x=margin+Math.random()*Math.max(0,maxX-margin),y=margin+Math.random()*Math.max(0,maxY-margin);if(![...active.keys()].some(other=>Math.abs(x-parseFloat(other.style.left))<size.width*.8&&Math.abs(y-parseFloat(other.style.top))<size.height*.8)){pos={x,y};break}}if(!pos){el.remove();return}el.style.left=pos.x+'px';el.style.top=pos.y+'px';let record={el,timeout:null,part:p};active.set(el,record);if(config[mode].lifetime)record.timeout=setTimeout(()=>removeItem(el),config[mode].lifetime);el.onclick=()=>{if(!playing||!active.has(el))return;if(p===target()){chime(true);collected++;el.classList.add('good');clearTimeout(record.timeout);active.delete(el);setTimeout(()=>el.remove(),270);updateHeader();if(collected>=goal){finish();return}if(![...active.values()].some(v=>v.part===target()))spawn()}else{chime(false);el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');toast('Try another one! 💜');setTimeout(()=>el.classList.remove('bad'),340)}}}
function finish(){clearGame();chime(true);overlay.classList.remove('hide');card.innerHTML=`<h1>🎉 Book Part Master!</h1><p style="font-size:55px;margin:5px">⭐⭐⭐⭐⭐</p><p>You collected all 10 ${PARTS[target()][1].toLowerCase()}!</p><button class="big" id="again">🔁 PLAY AGAIN</button><button class="big secondary" id="next">➡️ NEXT MISSION</button><button class="pill" id="choose">🏠 BACK TO MENU</button>`;say(`Amazing! You collected all ten ${PARTS[target()][1].toLowerCase()}!`);$('again').onclick=start;$('next').onclick=()=>{if(selected===8){round=random(8)}else selected=(selected+1)%8;start()};$('choose').onclick=goToGameMenu}
$('sound').onclick=()=>{voice=!voice;$('sound').textContent=voice?'🔊 Voice ON':'🔇 Voice OFF';$('sound').setAttribute('aria-pressed',String(voice));if(!voice&&'speechSynthesis'in window)window.speechSynthesis.cancel()};$('repeat').onclick=()=>say(`Collect all the ${PARTS[target()][1].toLowerCase()}! Don't collect the wrong parts!`);$('menu').onclick=goToGameMenu;window.addEventListener('resize',()=>{if(playing){active.forEach(v=>{let r=arena.getBoundingClientRect(),s=v.el.getBoundingClientRect();v.el.style.left=Math.min(parseFloat(v.el.style.left),Math.max(0,r.width-s.width-8))+'px';v.el.style.top=Math.min(parseFloat(v.el.style.top),Math.max(0,r.height-s.height-8))+'px'})}});menu();
</script>
</body></html>
