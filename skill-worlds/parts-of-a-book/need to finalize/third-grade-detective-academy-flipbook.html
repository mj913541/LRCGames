<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Missing Book Files — Detective Academy</title>
<style>
:root{--ink:#21352f;--paper:#fffaf0;--accent:#bf8647;--green:#20664c;--line:#d6c9b3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Trebuchet MS,Arial,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 10% 5%,#708e75,#233b32 65%,#182e2a);padding:clamp(7px,1.2vh,14px)}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e6a63f;outline-offset:2px}.app{height:100%;max-width:1550px;margin:auto;display:flex;flex-direction:column;gap:9px}.header{background:linear-gradient(120deg,#f7e7c6,#fff9eb 55%,#d4b48b);border:3px solid #b68c5a;border-radius:14px;box-shadow:0 4px 0 #142c25;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 17px;min-height:76px}.header h1{font-family:Georgia,serif;font-size:clamp(20px,2.5vw,36px);margin:0;line-height:1.1}.header small{font-size:clamp(10px,1.05vw,14px);letter-spacing:.15em;font-weight:800}.instructions{font-size:clamp(11px,1.05vw,15px);font-weight:700;max-width:260px;text-align:right}.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.9fr);gap:12px;min-height:0;flex:1}.viewer,.case{min-height:0;overflow:hidden;border-radius:16px;border:3px solid #9e8b71;box-shadow:0 6px 0 #172c25}.viewer{background:#e5e5d9;display:flex;flex-direction:column}.tabs{display:flex;gap:4px;padding:8px 8px 0;background:#394f46}.tab{flex:1;min-width:0;padding:9px 2px;background:#e8e8e1;border:0;border-radius:10px 10px 0 0;font-size:clamp(10px,1vw,14px);font-weight:800}.tab.active{background:#f6c989}.book-stage{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at center,#a68d6c 0%,#554a3a 100%);display:flex;align-items:center;justify-content:center;padding:10px 55px}.page{width:min(78%,440px);height:100%;max-height:610px;min-height:0;position:relative;background:linear-gradient(90deg,#b2a083 0,#f5ecd8 3%,#fffdf3 8%,#fffcf4 94%,#e6d9bd 100%);border-radius:4px 13px 13px 4px;box-shadow:-8px 5px 0 #574d3d,7px 10px 18px #251f1b90, inset -8px 0 12px #a3947540;overflow:hidden}.page.cover{border:8px solid #283e47;border-left-width:16px;background:#2b493b}.photo{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.95)}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#101b1a7a,transparent 40%,#0e181aa8)}.cover-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:clamp(12px,3vh,35px);color:white;text-shadow:0 2px 7px #000b}.cover-content h2{font-family:Georgia,serif;font-size:clamp(25px,3.1vw,48px);line-height:1.05;margin:0}.cover-content p{font-family:Georgia,serif;font-size:clamp(12px,1.2vw,17px);margin:0}.interior{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(10px,3vw,36px);font-family:Georgia,serif}.interior h2{font-size:clamp(24px,2.7vw,43px);line-height:1.1;margin:12px 0 25px}.interior h3{font-size:clamp(18px,1.8vw,27px);margin:6px}.interior p{font-size:clamp(13px,1.3vw,20px);line-height:1.55}.interior .imprint{font-size:clamp(12px,1.3vw,18px);margin-top:28px}.interior .rule{height:1px;width:70%;background:#b6a88b;margin:18px}.interior .copyright{font-size:clamp(12px,1.2vw,17px);text-align:left;align-self:stretch}.toc{width:100%;max-width:330px}.toc-row{display:flex;justify-content:space-between;border-bottom:1px dotted #9a8d73;padding:8px 0;gap:8px;font-size:clamp(13px,1.3vw,19px)}.turn{position:absolute;top:50%;transform:translateY(-50%);border-radius:50%;height:48px;width:48px;background:#fffdf2;border:2px solid #a9aa9b;font-size:30px;color:#174c56;box-shadow:0 3px 6px #0005}.turn.prev{left:7px}.turn.next{right:7px}.page-caption{background:#f4e7d2;padding:5px 10px;text-align:center;font-size:12px;font-weight:800}.case{background:linear-gradient(#eee0c6,#f8f1e4);padding:clamp(10px,1.3vw,22px);display:flex;flex-direction:column;gap:10px}.case-title{background:#fffaf0;border:2px solid #d2b68b;border-radius:10px;padding:10px;text-align:center}.case-title h2{font-family:Georgia,serif;font-size:clamp(18px,2vw,28px);margin:0 0 4px}.case-title p{font-size:clamp(11px,1vw,14px);margin:0}.fields{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(5px,1vh,13px)}.field{display:grid;grid-template-columns:35% 65%;align-items:center;gap:6px;background:#fffdf8;border:1px solid #d9c6a6;border-radius:10px;padding:clamp(5px,.8vh,10px)}.field label{font-size:clamp(12px,1.15vw,17px);font-weight:800}.field select{width:calc(100% - 6px);min-width:0;border:1.5px solid #91b6c4;background:#edf7fb;padding:clamp(7px,1vh,12px) 6px;border-radius:7px;font-size:clamp(12px,1.05vw,16px)}.field.correct{border-color:#2c8c56;background:#e6f7e8}.field.wrong{border-color:#c0574c;background:#fff0eb}.status{font-size:clamp(11px,1vw,14px);font-weight:700;min-height:20px;text-align:center}.check{background:linear-gradient(#298a5b,#16593d);border:2px solid #104e36;border-radius:30px;color:#fff;font-weight:900;padding:clamp(10px,1.4vh,17px);font-size:clamp(15px,1.4vw,21px)}.check:disabled{opacity:.5;cursor:not-allowed}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center}.back,.case-pill,.restart{background:#f5ead7;color:#243d35;border:2px solid #ae8f67;border-radius:10px;padding:9px 13px;font-weight:800;text-decoration:none;font-size:clamp(11px,1vw,14px)}.case-nav{display:flex;gap:7px}.case-pill.current{background:#f4c77f}.case-pill:disabled{opacity:.55;cursor:not-allowed}.celebrate{position:absolute;inset:0;background:#f7ecd8f5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:3}.celebrate h2{font-family:Georgia,serif;font-size:clamp(25px,3vw,44px)}.celebrate button{padding:12px 20px;background:#236c4d;color:white;border:0;border-radius:12px;font-weight:800}.hidden{display:none!important}@media(max-width:740px){.header{min-height:55px;padding:5px 9px}.instructions{font-size:10px}.main{grid-template-columns:1.05fr 1fr;gap:5px}.app{gap:5px}.viewer,.case{border-width:2px}.case{padding:5px;gap:5px}.case-title{padding:4px}.case-title h2{font-size:15px}.case-title p{font-size:10px}.tabs{padding:4px 3px 0;gap:2px}.tab{font-size:9px;padding:7px 1px}.book-stage{padding:5px 31px}.page{width:94%}.turn{height:30px;width:30px;font-size:20px}.field{grid-template-columns:1fr;gap:2px;padding:3px}.field label{font-size:11px}.field select{font-size:11px;padding:5px}.footer .case-pill{padding:6px}.footer .back{padding:6px}.cover-content h2{font-size:23px}.interior h2{font-size:20px}}@media(max-height:580px){.header{min-height:45px}.header h1{font-size:20px}.header small{font-size:10px}.tabs .tab{padding:5px 1px}.case-title{padding:5px}.case-title h2{font-size:17px}.case{gap:4px;padding:7px}.field{padding:4px}.field select{padding:5px}.check{padding:8px}.book-stage{padding-top:4px;padding-bottom:4px}.footer .back,.footer .case-pill{padding:6px}.interior h2{margin:4px 0 10px}.interior .rule{margin:7px}.interior .imprint{margin-top:8px}}
</style></head><body><div class="app"><header class="header"><div><small>🔎 THE MISSING BOOK FILES · THIRD GRADE · LEVEL 3</small><h1>Detective Academy</h1></div><div class="instructions">Flip through the book. Find the clues. Complete the missing details!</div></header><main class="main"><section class="viewer" aria-label="Interactive book"><nav class="tabs" id="tabs"></nav><div class="book-stage"><button class="turn prev" id="prev" aria-label="Previous page">❮</button><div class="page" id="page"></div><button class="turn next" id="next" aria-label="Next page">❯</button><div id="celebrate" class="celebrate hidden"></div></div><div class="page-caption" id="page-caption">Use the tabs or arrows to flip through the book.</div></section><section class="case"><div class="case-title"><h2 id="case-title">🔎 Case 1: Rookie Detective</h2><p>Use the book to find the missing information.</p></div><div class="fields" id="fields"></div><div class="status" id="status" aria-live="polite"></div><button class="check" id="check">✓ Check My Answers</button></section></main><footer class="footer"><a class="back" href="game-index.html">⌂ Back to Menu</a><div class="case-nav" id="case-nav"></div></footer></div>
<script>
// To customize the books, edit this list. Photos are remote Unsplash images;
// the book, title page, copyright page and table of contents are all built in HTML.
const books=[
{title:'Forest Friends',author:'Jenna Woods',illustrator:'Caleb Martin',publisher:'Oakleaf Press',year:'2023',chapters:['The Woodland Path','A New Neighbor','The Big Storm','Friends Forever'],photo:'https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=1000&q=85',fallback:'linear-gradient(135deg,#21482b,#b0b96c)'},
{title:'The Moonlight Dragon',author:'Oliver Stone',illustrator:'Maya Reed',publisher:'Starry Sky Books',year:'2021',chapters:['The Hidden Cave','A Silver Egg','Flight at Midnight','The Journey Home'],photo:'https://images.unsplash.com/photo-1475274047050-1d0c0975c63e?auto=format&fit=crop&w=1000&q=85',fallback:'linear-gradient(135deg,#14284b,#8060a1)'},
{title:'The Secret Garden Gate',author:'Emma Rivers',illustrator:'Sofia Lane',publisher:'Willow Tree Press',year:'2024',chapters:['The Old Key','Behind the Wall','A Secret Path','The Garden Party'],photo:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=1000&q=85',fallback:'linear-gradient(135deg,#234d2f,#9cbf75)'},
{title:'Captain Comet’s Adventure',author:'Noah Brooks',illustrator:'Iris Moon',publisher:'Galaxy Books',year:'2022',chapters:['Ready for Launch','A Strange Signal','Planet Blue','Home Again'],photo:'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1000&q=85',fallback:'linear-gradient(135deg,#081b43,#5862b0)'},
{title:'The Mystery of Maple Street',author:'Ava Bennett',illustrator:'Theo Price',publisher:'Lantern Press',year:'2025',chapters:['The Missing Letter','Footprints','The Attic','Case Closed'],photo:'https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=85',fallback:'linear-gradient(135deg,#3d3c23,#c38c43)'}
];
const keys=[['title','Title','📘'],['author','Author','✏️'],['illustrator','Illustrator','🎨'],['publisher','Publisher','🏛️'],['year','Publication Year','🗓️']];
const pages=['Cover','Title Page','Copyright','Table of Contents','Story Page'];const names=['Rookie Detective','Junior Detective','Master Detective'];
let order=[],caseIndex=0,pageIndex=0,answers={},finished=false;
const $=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function current(){return books[order[caseIndex]]}
function requested(){return caseIndex===0?['author']:caseIndex===1?['publisher','year']:['title','author','illustrator','publisher','year']}
function start(){order=shuffle(books.map((_,i)=>i)).slice(0,3);caseIndex=0;pageIndex=0;answers={};finished=false;render()}
function render(){renderTabs();renderPage();renderCase();renderNav();$('celebrate').classList.add('hidden')}
function renderTabs(){$('tabs').innerHTML=pages.map((p,i)=>`<button class="tab ${i===pageIndex?'active':''}" data-page="${i}">${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{pageIndex=+el.dataset.page;renderTabs();renderPage()})}
function renderPage(){let b=current(),html='';if(pageIndex===0){html=`<div class="photo" style="background-image:linear-gradient(180deg,#0002,#0004),url('${b.photo}');background-color:#3c5b49"></div><div class="cover-content"><h2>${escapeHtml(b.title)}</h2><p>Written by ${escapeHtml(b.author)}<br>Illustrated by ${escapeHtml(b.illustrator)}</p></div>`}else if(pageIndex===1){html=`<div class="interior"><p>✦ ✦ ✦</p><h2>${escapeHtml(b.title)}</h2><div class="rule"></div><p>Written by<br><strong>${escapeHtml(b.author)}</strong></p><p>Illustrated by<br><strong>${escapeHtml(b.illustrator)}</strong></p><p class="imprint">${escapeHtml(b.publisher)}</p></div>`}else if(pageIndex===2){html=`<div class="interior"><h3>Publication Information</h3><div class="rule"></div><p class="copyright">Copyright © ${escapeHtml(b.year)} by ${escapeHtml(b.author)}.<br><br>All rights reserved.<br><br>Published by ${escapeHtml(b.publisher)}.<br><br>This is a fictional book created for classroom practice.</p></div>`}else if(pageIndex===3){html=`<div class="interior"><h3>Table of Contents</h3><div class="rule"></div><div class="toc">${b.chapters.map((c,i)=>`<div class="toc-row"><span>${i+1}. ${escapeHtml(c)}</span><span>${i*6+1}</span></div>`).join('')}</div></div>`}else{html=`<div class="interior"><p>Chapter 1</p><h2>${escapeHtml(b.chapters[0])}</h2><div class="rule"></div><p>Every great adventure begins with a question. What would the characters discover today?</p><p>Turn back to the title or copyright page to find the book details.</p></div>`}$('page').className='page '+(pageIndex===0?'cover':'');$('page').innerHTML=html;$('page-caption').textContent=`Page ${pageIndex+1} of ${pages.length} · ${pages[pageIndex]}`;$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1}
function renderCase(){let req=requested();$('case-title').textContent=`🔎 Case ${caseIndex+1}: ${names[caseIndex]}`;$('fields').innerHTML=keys.map(([key,label,emoji])=>{let isReq=req.includes(key);let b=current();if(!isReq)return `<div class="field"><label>${emoji} ${label}</label><strong>${escapeHtml(b[key])}</strong></div>`;let choices=shuffle([...new Set(books.map(book=>book[key]))]);return `<div class="field" id="field-${key}"><label for="answer-${key}">${emoji} ${label}</label><select id="answer-${key}" data-key="${key}"><option value="">Choose an answer…</option>${choices.map(v=>`<option value="${escapeHtml(v)}" ${answers[key]===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div>`}).join('');document.querySelectorAll('select[data-key]').forEach(el=>el.onchange=()=>{answers[el.dataset.key]=el.value;$('status').textContent='';document.querySelectorAll('.field').forEach(f=>f.classList.remove('correct','wrong'))});$('check').textContent='✓ Check My Answers';$('check').disabled=false;$('status').textContent=''}
function renderNav(){$('case-nav').innerHTML=names.map((n,i)=>`<button class="case-pill ${i===caseIndex?'current':''}" ${i!==caseIndex?'disabled':''}>${i===caseIndex?'📂':'🔒'} Case ${i+1}</button>`).join('')}
function check(){let req=requested(),b=current(),right=0;req.forEach(key=>{let ok=answers[key]===b[key];$('field-'+key).classList.toggle('correct',ok);$('field-'+key).classList.toggle('wrong',!ok);if(ok)right++});if(right!==req.length){$('status').textContent=`${right} of ${req.length} correct. Look through the pages and try again!`;$('status').style.color='#9c3c32';return}$('status').textContent='Excellent detective work! Case solved!';$('status').style.color='#20664c';$('check').disabled=true;setTimeout(()=>{if(caseIndex<2){caseIndex++;pageIndex=0;answers={};render()}else{finished=true;$('celebrate').innerHTML='<h2>🏆 Case Closed!</h2><p>You solved all three book mysteries!</p><p>Excellent work finding information in real book pages.</p><button id="play-again">Play Again ↻</button>';$('celebrate').classList.remove('hidden');$('play-again').onclick=start}},800)}
$('check').onclick=check;$('prev').onclick=()=>{if(pageIndex>0){pageIndex--;renderTabs();renderPage()}};$('next').onclick=()=>{if(pageIndex<pages.length-1){pageIndex++;renderTabs();renderPage()}};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});start();
</script></body></html>
