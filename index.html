<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LRC Quest</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #243049;
      background:
        radial-gradient(circle at 12% 16%,
        rgba(255, 210, 58, 0.22),
        transparent 22rem),
        radial-gradient(circle at 88% 82%,
        rgba(65, 133, 219, 0.20),
        transparent 24rem),
        linear-gradient(145deg, #fffdf7, #eef8ff);
    }

    main {
      width: min(100%, 900px);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #493082;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1;
    }

    .instructions {
      margin: 15px 0 45px;
      font-size: clamp(18px, 3vw, 23px);
      font-weight: bold;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      align-items: center;
    }

    .choice {
      min-height: 145px;
      border: 4px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      display: grid;
      place-items: center;
      padding: 16px;
      color: white;
      font-family: inherit;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 10px 0 rgba(36, 48, 73, 0.14),
        0 16px 28px rgba(36, 48, 73, 0.12);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .choice:hover {
      transform: scale(1.09);
      filter: brightness(1.05);
      box-shadow:
        0 13px 0 rgba(36, 48, 73, 0.13),
        0 23px 34px rgba(36, 48, 73, 0.18);
      z-index: 1;
    }

    .choice:active {
      transform: scale(1.03);
    }

    .choice:focus-visible {
      outline: 5px solid #17233b;
      outline-offset: 5px;
    }

    .kindergarten {
      background: #dc3545;
    }

    .first {
      background: #ffd43b;
      color: #453500;
    }

    .second {
      background: #f28c28;
      color: #342000;
    }

    .third {
      background: #2878c8;
    }

    .fourth {
      background: #7651b8;
    }

    .fifth {
      background: #2c9348;
    }

    .staff {
      grid-column: 2;
      background: #3f4652;
    }

    @media (max-width: 680px) {
      .choices {
        grid-template-columns: repeat(2, 1fr);
      }

      .staff {
        grid-column: 1 / -1;
        width: calc(50% - 12px);
        justify-self: center;
      }

      .choice {
        min-height: 110px;
      }
    }

    @media (max-width: 420px) {
      .choices {
        grid-template-columns: 1fr;
      }

      .staff {
        grid-column: auto;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>LRC Quest</h1>
    <p class="instructions">Choose your grade level or staff.</p>

    <nav class="choices" aria-label="LRC Quest areas">

      <!-- Replace # with each grade level's link -->
      <a class="choice kindergarten" href="#">
        Kindergarten
      </a>

      <a class="choice first" href="#">
        1st Grade
      </a>

      <a class="choice second" href="#">
        2nd Grade
      </a>

      <a class="choice third" href="#">
        3rd Grade
      </a>

      <a class="choice fourth" href="#">
        4th Grade
      </a>

      <a
        class="choice fifth"
        href="https://www.typing.com/join#6AA8163E63267"
      >
        5th Grade
      </a>

      <a class="choice staff" href="#">
        Staff
      </a>

    </nav>
  </main>
</body>
</html>
