
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LRC Quest | Open Your Adventure</title>

<style>

/* ========================================
   LRC QUEST - STORYBOOK HOMEPAGE
======================================== */

:root {
  --purple: #55346f;
  --gold: #efcb78;
  --cream: #fff3d6;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Trebuchet MS", Arial, sans-serif;
}

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: white;

  background: radial-gradient(
    ellipse at 50% 30%,
    #d8e8cd,
    #8ab49d 62%,
    #456c5d
  );
}

/* ========================================
   FLOATING FOREST DECORATIONS
======================================== */

.forest {
  position: fixed;
  inset: 0;
  pointer-events: none;

  background:
    radial-gradient(
      circle at 10% 15%,
      #f5ddac80,
      transparent 27%
    ),
    radial-gradient(
      circle at 85% 80%,
      #d5b6ee66,
      transparent 30%
    );
}

.leaf {
  position: fixed;
  z-index: 1;
  font-size: clamp(22px, 3vw, 45px);
  opacity: .65;
  animation: drift 9s ease-in-out infinite;
  pointer-events: none;
}

.leaf:nth-child(2) {
  top: 8%;
  left: 6%;
}

.leaf:nth-child(3) {
  top: 14%;
  right: 9%;
  animation-delay: -3s;
}

.leaf:nth-child(4) {
  bottom: 12%;
  left: 10%;
  animation-delay: -6s;
}

.leaf:nth-child(5) {
  bottom: 8%;
  right: 8%;
  animation-delay: -2s;
}

@keyframes drift {
  0%, 100% {
    transform: translate(0, 0) rotate(-8deg);
  }

  50% {
    transform: translate(13px, -17px) rotate(14deg);
  }
}

/* ========================================
   MAIN HOMEPAGE CONTAINER
======================================== */

main {
  position: relative;
  z-index: 2;

  width: 100vw;
  height: 100dvh;

  display: grid;
  place-items: center;

  perspective: 1800px;
}

/* ========================================
   CLOSED STORYBOOK
======================================== */

.intro {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  gap: 16px;

  transition:
    opacity .3s,
    visibility .3s;

  z-index: 4;
}

.book-wrap {
  width: clamp(225px, 32vw, 365px);
  aspect-ratio: .76;

  position: relative;

  filter: drop-shadow(
    18px 20px 12px #18291f66
  );

  animation: bob 4s ease-in-out infinite;

  transform-style: preserve-3d;
  cursor: pointer;
}

@keyframes bob {
  50% {
    transform: translateY(-10px);
  }
}

/* BOOK PAGES */

.book-pages {
  position: absolute;
  inset: 8px -9px -7px 8px;

  border-radius: 8px 17px 17px 8px;

  background: repeating-linear-gradient(
    0deg,
    #fff0cf 0 3px,
    #d3ba8e 3px 4px
  );

  box-shadow: 5px 7px 0 #b9946b;
}

/* PURPLE BOOK COVER */

.cover {
  position: absolute;
  inset: 0;

  border: 9px solid #a77d43;
  border-left: 17px solid #3d235a;

  border-radius: 13px 19px 19px 13px;

  background: linear-gradient(
    135deg,
    #8055a1,
    #503268 68%,
    #33204c
  );

  box-shadow:
    inset 0 0 0 5px #d6b572,
    inset 0 0 0 10px #76528d;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
  gap: 17px;

  transform-origin: left center;
  backface-visibility: hidden;
}

.cover::before,
.cover::after {
  content: "✦  ✧  ✦";
  color: #f6d68b;
  font-size: 26px;
}

.cover .icon {
  font-size: clamp(52px, 7vw, 85px);
}

.cover h1 {
  font-size: clamp(34px, 5vw, 59px);
  line-height: 1.05;

  color: #ffe49e;

  text-shadow: 2px 3px #281a3c;

  margin: 0;
  letter-spacing: 2px;
}

.cover p {
  font-size: clamp(14px, 1.7vw, 20px);
  margin: 0;
  color: #fff5d6;
}

/* ========================================
   BUTTONS
======================================== */

.open-button,
.reset-button {
  border: 3px solid #f3d993;
  border-radius: 999px;

  padding: 13px 27px;

  font-size: clamp(17px, 2vw, 22px);
  font-weight: 900;

  background: #fff1c5;
  color: #49336b;

  cursor: pointer;

  box-shadow: 0 6px 0 #886c48;

  transition: transform .2s;
}

.open-button:hover,
.reset-button:hover {
  transform: translateY(-4px);
}

.open-button:focus-visible,
.reset-button:focus-visible,
.hotspot:focus-visible {
  outline: 5px solid white;
  outline-offset: 4px;
}

.hint {
  font-size: clamp(14px, 1.6vw, 18px);
  font-weight: bold;
  text-shadow: 0 2px 6px #173b29;
}

/* ========================================
   RESPONSIVE OPEN STORYBOOK

   The image and hotspots share the
   exact same container.

   They scale together automatically.
======================================== */

.scene {
  position: relative;

  /* Original illustration proportions */
  aspect-ratio: 3 / 2;

  /* Fit width AND height of browser */
  width: min(96vw, 141dvh, 1180px);

  max-width: 100%;
  max-height: 94dvh;

  opacity: 0;

  transform:
    scale(.86)
    rotateX(7deg);

  /* Faster reveal animation */
  transition:
    opacity .4s,
    transform .575s cubic-bezier(.16, 1, .3, 1);

  pointer-events: none;

  filter: drop-shadow(
    0 20px 24px #162a2566
  );
}

/* BACKGROUND IMAGE */

.scene img {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  display: block;
  border-radius: 12px;
}

/* ========================================
   CLICKABLE HOTSPOTS
======================================== */

.hotspot {
  position: absolute;
  z-index: 5;

  display: block;

  border: 3px solid transparent;
  background: transparent;
  border-radius: 22px;

  cursor: pointer;

  transition:
    background .25s,
    border-color .25s,
    transform .25s;

  transform: scale(1);
  text-decoration: none;
  padding: 0;
}

.hotspot:hover,
.hotspot:focus-visible {
  border-color: #fff3b7;
  background: #fff6bb2b;

  transform: scale(1.05);

  box-shadow: 0 0 0 4px #f6d47a66;
}

/* ========================================
   HOTSPOT POSITIONS

   All positions use percentages of
   the storybook illustration.

   They stay aligned when resized.
======================================== */

/* STUDENTS SIGN */

.students {
  left: 15%;
  top: 44%;
  width: 24%;
  height: 23%;
}

/* STAFF SIGN */

.staff {
  left: 63%;
  top: 37%;
  width: 20%;
  height: 21%;
}

/* EVENTS SIGN */

.events {
  left: 65%;
  top: 59%;
  width: 23%;
  height: 22%;
}

/* SCREEN READER TEXT */

.hotspot span {
  position: absolute;

  width: 1px;
  height: 1px;

  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

/* ========================================
   HOTSPOT TEST MODE

   Add ?showHotspots=1 to the URL
   to see the clickable areas.
======================================== */

.show-hotspots .hotspot {
  border: 3px dashed #ffeb3b;
  background: #ffeb3b44;
}

.show-hotspots .students {
  border-color: #31e66c;
  background: #31e66c44;
}

.show-hotspots .staff {
  border-color: #ffcc33;
  background: #ffcc3344;
}

.show-hotspots .events {
  border-color: #ff73dc;
  background: #ff73dc44;
}

/* ========================================
   CLOSE BOOK BUTTON
======================================== */

.scene-controls {
  position: absolute;

  right: 3%;
  bottom: 2%;

  z-index: 10;

  opacity: 0;
  pointer-events: none;

  transition: opacity .3s;
}

.reset-button {
  padding: 8px 16px;
  font-size: 14px;
  box-shadow: 0 3px 0 #886c48;
}

/* ========================================
   DOUBLE-SPEED BOOK OPENING ANIMATION
======================================== */

.opened .intro {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.opening .cover {
  animation:
    turnCover .625s cubic-bezier(.45, 0, .2, 1) forwards;
}

.opening .book-wrap {
  animation: none;
}

.opened .scene {
  opacity: 1;

  transform:
    scale(1)
    rotateX(0);

  pointer-events: auto;
}

.opened .scene-controls {
  opacity: 1;
  pointer-events: auto;
}

@keyframes turnCover {
  0% {
    transform: rotateY(0);
  }

  100% {
    transform: rotateY(-160deg);
  }
}

/* ========================================
   FLOATING BUTTERFLY
======================================== */

.butterfly {
  position: absolute;

  left: 47%;
  top: 23%;

  font-size: clamp(18px, 3vw, 38px);

  opacity: 0;
  pointer-events: none;

  z-index: 3;
}

.opened .butterfly {
  opacity: 1;
  animation: fly 8s ease-in-out infinite;
}

@keyframes fly {
  0%, 100% {
    transform:
      translate(0, 0)
      rotate(-15deg);
  }

  50% {
    transform:
      translate(100px, -38px)
      rotate(20deg);
  }
}

/* ========================================
   ACCESSIBILITY STATUS
======================================== */

#status {
  position: absolute;
  left: -9999px;
}

/* ========================================
   SMALL SCREENS
======================================== */

@media (max-width: 700px) {

  .scene {
    width: min(98vw, 147dvh);
  }

  .reset-button {
    font-size: 11px;
    padding: 6px 10px;
  }
}

/* ========================================
   SHORT SCREENS
======================================== */

@media (max-height: 500px) {

  .scene {
    width: min(96vw, 138dvh);
  }

  .book-wrap {
    width: min(32vw, 45dvh);
  }

  .intro {
    gap: 7px;
  }
}

/* ========================================
   REDUCED MOTION
======================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }

  .opening .cover {
    transform: rotateY(-160deg);
  }
}

</style>
</head>

<body>

<!-- ========================================
     FLOATING FOREST DECORATIONS
======================================== -->

<div class="forest"></div>

<div class="leaf">🍃</div>
<div class="leaf">🌿</div>
<div class="leaf">🍂</div>
<div class="leaf">🌱</div>

<!-- ========================================
     MAIN HOMEPAGE
======================================== -->

<main id="app">

  <!-- CLOSED STORYBOOK -->

  <section
    class="intro"
    aria-label="LRC Quest book cover"
  >

    <div class="book-wrap" id="book">

      <div class="book-pages"></div>

      <div class="cover">

        <div class="icon">📖</div>

        <h1>LRC<br>QUEST</h1>

        <p>THE WORLD OF STORIES</p>

      </div>

    </div>

    <button
      class="open-button"
      id="openBook"
    >
      📖 Open My Adventure!
    </button>

    <div class="hint">
      ✨ Read • Explore • Create • Grow ✨
    </div>

  </section>

  <!-- ========================================
       OPEN STORYBOOK

       Background and hotspots stay
       connected on every screen.
  ======================================== -->

  <section
    class="scene"
    aria-label="Open storybook with three destinations"
  >

    <!-- BACKGROUND IMAGE -->

    <img
      src="./img/bg/book-homepage-bg.png"
      alt="An open magical LRC Quest storybook with wooden signs for Students, Staff and Events among a jungle landscape"
    >

    <!-- ==================================
         STUDENTS HOTSPOT
    =================================== -->

    <a
      class="hotspot students"
      href="./construction.html"
      aria-label="Students: games, grade levels, and learning worlds"
    >
      <span>Students</span>
    </a>

    <!-- ==================================
         STAFF HOTSPOT
    =================================== -->

    <a
      class="hotspot staff"
      href="./construction.html"
      aria-label="Staff: resources, ideas, plans and support"
    >
      <span>Staff</span>
    </a>

    <!-- ==================================
         EVENTS HOTSPOT
    =================================== -->

    <a
      class="hotspot events"
      href="./construction.html"
      aria-label="Events: what's happening in the LRC"
    >
      <span>Events</span>
    </a>

    <!-- FLOATING BUTTERFLY -->

    <div
      class="butterfly"
      aria-hidden="true"
    >
      🦋
    </div>

  </section>

  <!-- ========================================
       CLOSE BOOK BUTTON
  ======================================== -->

  <div class="scene-controls">

    <button
      class="reset-button"
      id="closeBook"
    >
      ↩ Close Book
    </button>

  </div>

  <!-- ACCESSIBILITY STATUS -->

  <p id="status" aria-live="polite"></p>

</main>

<!-- ========================================
     JAVASCRIPT
======================================== -->

<script>

const app = document.getElementById("app");

const openButton =
  document.getElementById("openBook");

const closeButton =
  document.getElementById("closeBook");

const status =
  document.getElementById("status");

let timer;

/* ========================================
   OPEN BOOK - DOUBLE SPEED
======================================== */

function openBook() {

  if (app.classList.contains("opening")) {
    return;
  }

  clearTimeout(timer);

  app.classList.add("opening");

  openButton.disabled = true;

  status.textContent =
    "Opening your storybook adventure";

  /* Reveal the jungle after 575ms */

  timer = setTimeout(() => {

    app.classList.add("opened");

    status.textContent =
      "The book is open. Choose Students, Staff, or Events.";

    document.querySelector(".students").focus({
      preventScroll: true
    });

  }, 575);

}

/* ========================================
   CLOSE BOOK
======================================== */

function closeBook() {

  clearTimeout(timer);

  app.classList.remove(
    "opened",
    "opening"
  );

  openButton.disabled = false;

  status.textContent = "Book closed";

  openButton.focus({
    preventScroll: true
  });

}

/* ========================================
   BUTTON EVENTS
======================================== */

openButton.addEventListener(
  "click",
  openBook
);

document
  .getElementById("book")
  .addEventListener(
    "click",
    openBook
  );

closeButton.addEventListener(
  "click",
  closeBook
);

/* ========================================
   HOTSPOT TESTING MODE

   Add ?showHotspots=1 to your URL
   to display the clickable regions.
======================================== */

const params = new URLSearchParams(
  window.location.search
);

if (params.get("showHotspots") === "1") {

  document.body.classList.add(
    "show-hotspots"
  );

}

</script>

</body>
</html>
