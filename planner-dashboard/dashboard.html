<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planner Dashboard</title>

    <link rel="stylesheet" href="./header.css">
    <link rel="stylesheet" href="./dashboard.css">

</head>

<body>
    <div id="site-header">
        PUT THE HEADER HERE
    </div>
<main class="dashboard-layout">

    <div class="dashboard-left">

        <section class="notebook">
            <h2>Notebook</h2>

            <textarea
                id="notebook"
                placeholder="Write anything you need to remember..."
            ></textarea>
        </section>


        <section class="todo">
            <h2>To-Do</h2>

            <div class="todo-list">

                <label>
                    <input type="checkbox">
                    Example task
                </label>

            </div>
        </section>

    </div>


    <aside class="timeline">

        <h2>Today</h2>

        <div class="timeline-item">
            <span class="timeline-time">8:00</span>
            <span class="timeline-event">Start the day</span>
        </div>

        <div class="timeline-item">
            <span class="timeline-time">9:00</span>
            <span class="timeline-event">Morning</span>
        </div>

        <div class="timeline-item">
            <span class="timeline-time">10:00</span>
            <span class="timeline-event">Work</span>
        </div>

    </aside>

</main>

    <h1>Planner Dashboard</h1>

    <p>This is my planner dashboard.</p>

    <script src="./header.js"></script>
    <script src="./dashboard.js"></script>
</body>

</html>
