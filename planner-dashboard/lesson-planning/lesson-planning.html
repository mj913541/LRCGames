<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Lesson Planning</title>

    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="./lesson-planning.css">
</head>

<body
    class="planner-body"
    data-page="home"
>

    <div id="site-header"></div>

    <main class="lesson-planning-page">

        <!-- =========================================
             PAGE HEADER
        ========================================== -->

        <section class="lesson-page-header">

            <div>
                <p class="lesson-eyebrow">
                    LRC Planner
                </p>

                <h1>📚 Lesson Planning</h1>

                <p class="lesson-subtitle">
                    Plan it. Prep it. Teach it. Keep moving.
                </p>
            </div>

            <div class="lesson-sync-status">
                <span data-sync-status>
                    ☁️ Connecting…
                </span>
            </div>

        </section>


        <!-- =========================================
             OVERALL READINESS
        ========================================== -->

        <section class="lesson-summary-panel">

            <div class="summary-heading">

                <div>
                    <p class="lesson-eyebrow">
                        Overall Progress
                    </p>

                    <h2>
                        Curriculum Readiness
                    </h2>
                </div>

                <strong id="overallPercent">
                    0%
                </strong>

            </div>

            <div class="progress-track">

                <div
                    id="overallBar"
                    class="progress-bar"
                ></div>

            </div>

            <p
                id="overallDetail"
                class="summary-detail"
            >
                Loading lesson progress…
            </p>

        </section>


        <!-- =========================================
             GRADE LEVELS
        ========================================== -->

        <section class="grade-section">

            <div class="section-heading">

                <div>
                    <p class="lesson-eyebrow">
                        Curriculum
                    </p>

                    <h2>
                        Choose a Grade Level
                    </h2>
                </div>

            </div>

            <div
                id="gradeGrid"
                class="grade-grid"
            ></div>

        </section>

    </main>


    <!-- =========================================
         SHARED PLANNER HEADER
    ========================================== -->

    <script>
        window.headerPath = "../header.html";
    </script>

    <script src="../header.js"></script>

    <script
        type="module"
        src="./lesson-planning.js"
    ></script>

</body>

</html>
